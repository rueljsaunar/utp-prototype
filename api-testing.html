<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UTP API Testing workspace</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B0102A}a:hover{color:#7A0A1C}
</style>
<style>:focus-visible{outline:3px solid #C8102E;outline-offset:2px}</style>
<script src="runtime.js" defer></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; color: #111113; background: #F5F5F6">

<nav aria-label="Main" style="flex: 1 1 240px; max-width: 100%; box-sizing: border-box; background: #0B0B0D; color: #FFFFFF; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<div style="width: 32px; height: 32px; border-radius: 8px; background: {{accent}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">U</div>
<div style="display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 16px; letter-spacing: 0.02em">UTP</span><span style="font-size: 11px; color: #A1A1A8">Unified Test Platform</span></div>
</div>
<button type="button" style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid #2A2A2F; background: #141417; color: #FFFFFF; font: inherit; font-size: 13px; cursor: pointer">Project: Customer Portal<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8E8E96; padding: 0 12px 6px">TEST MANAGEMENT</span>
<a href="index.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></span>Dashboard</a>
<a href="requirements.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></span>Requirements</a>
<a href="test-case.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12l3 3 5-6"/></svg></span>Test Cases</a>
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8E8E96; padding: 14px 12px 6px">AUTOMATION</span>
<a href="scripts.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg></span>Scripts</a>
<a href="ai-studio.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg></span>AI Studio</a>
<a href="recorder.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></span>Recorder</a>
<a href="object-repository.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 22V12M21 7l-9 5-9-5"/></svg></span>Object Repository</a>
<a href="framework-export.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg></span>Framework Export</a>
<a href="api-testing.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #FFFFFF; background: #222226; text-decoration: none; font-size: 14px; font-weight: 600"><span style="display: flex; color: {{accent}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1M16 3h1a2 2 0 0 1 2 2v5a2 2 0 0 0 2 2 2 2 0 0 0-2 2v5a2 2 0 0 1-2 2h-1"/></svg></span>API Testing</a>
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8E8E96; padding: 14px 12px 6px">EXECUTION</span>
<a href="new-run.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg></span>New Run</a>
<a href="results.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>Results</a>
<a href="devices.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></span>Devices</a>
<a href="report-builder.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg></span>Reports</a>
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8E8E96; padding: 14px 12px 6px">ADMIN</span>
<a href="integrations.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></span>Integrations</a>
</div>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px; border-top: 1px solid #222226">
<div style="width: 32px; height: 32px; border-radius: 50%; background: #FFFFFF; color: #0B0B0D; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">QL</div>
<div style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600">QA Lead</span><span style="font-size: 11px; color: #A1A1A8">Admin access</span></div>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 24px; background: #FFFFFF; border-bottom: 1px solid #E4E4E7">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<h1 style="margin: 0; font-size: 20px; font-weight: 700">API Testing</h1>
<span style="font-size: 13px; color: #55555D">Customer Portal APIs</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #55555D">Environment<select style="min-height: 40px; padding: 0 10px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 14px; background: #FFFFFF; color: #111113"><option>staging</option><option>qa</option><option>No environment</option></select></label>
<a href="postman-import-export.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid #111113; color: #111113; text-decoration: none; font-size: 13px; font-weight: 600">Import</a>
<a href="postman-import-export.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid #111113; color: #111113; text-decoration: none; font-size: 13px; font-weight: 600">Export</a>
<a href="api-results.html" style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 8px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-size: 13px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg>Run collection</a>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; flex: 1; min-height: 0">
<aside aria-label="Collections" style="flex: 1 1 250px; background: #FFFFFF; border-right: 1px solid #E4E4E7; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; gap: 6px; padding: 0 4px 10px">
<label style="flex: 1; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search requests</span><input type="search" placeholder="Search requests" style="flex: 1; min-height: 36px; padding: 0 10px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 13px"></label>
<button type="button" aria-label="New request" style="width: 36px; height: 36px; border-radius: 8px; border: 1px solid #111113; background: #FFFFFF; font: inherit; font-size: 18px; cursor: pointer">+</button>
</div>
<template data-sc="for" list="{{tree}}" as="t" hint-placeholder-count="14">
<button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 8px 0 {{t.indent}}; border: 0; border-radius: 6px; background: {{t.bg}}; color: {{t.fg}}; font: inherit; font-size: 13px; font-weight: {{t.weight}}; text-align: left; cursor: pointer"><span style="width: 46px; flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700; color: {{t.mc}}">{{t.method}}</span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span></button>
</template>
</aside>

<section aria-label="Request" style="flex: 3 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 0; background: #FFFFFF">
<div style="display: flex; gap: 8px; padding: 14px 16px; border-bottom: 1px solid #E4E4E7; flex-wrap: wrap">
<label style="display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Method</span><select style="min-height: 44px; padding: 0 10px; border: 1px solid #D4D4D8; border-radius: 8px 0 0 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 700; background: #F5F5F6"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option></select></label>
<label style="flex: 1 1 300px; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">URL</span><input value="{{baseUrl}}/orders/{{orderId}}" style="flex: 1; min-height: 44px; padding: 0 12px; margin-left: -9px; border: 1px solid #D4D4D8; border-radius: 0 8px 8px 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px"></label>
<button type="button" style="min-height: 44px; padding: 0 22px; border-radius: 8px; border: 0; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Send</button>
<button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid #D4D4D8; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Save</button>
</div>
<div role="tablist" aria-label="Request sections" style="display: flex; flex-wrap: wrap; gap: 2px; padding: 0 12px; border-bottom: 1px solid #E4E4E7">
<template data-sc="for" list="{{tabs}}" as="t" hint-placeholder-count="7"><button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="min-height: 40px; padding: 0 12px; border: 0; border-bottom: {{t.border}}; background: transparent; color: {{t.fg}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{t.label}}</button></template>
</div>
<div style="padding: 14px 16px; min-height: 190px; box-sizing: border-box">
<template data-sc="if" value="{{isTests}}" hint-placeholder-val="{{ true }}">
<div style="background: #0B0B0D; border-radius: 8px; padding: 12px 0; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 21px; overflow-x: auto"><template data-sc="for" list="{{testCode}}" as="l" hint-placeholder-count="7"><div style="display: flex; white-space: pre"><span style="width: 36px; flex: none; padding-right: 12px; text-align: right; color: #6B6B73">{{l.n}}</span><span style="color: {{l.c}}">{{l.t}}</span></div></template></div>
<div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; font-size: 12px"><span style="color: #55555D">Snippets:</span><button type="button" style="min-height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid #D4D4D8; background: #FFFFFF; font: inherit; font-size: 12px; cursor: pointer">Status code is 200</button><button type="button" style="min-height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid #D4D4D8; background: #FFFFFF; font: inherit; font-size: 12px; cursor: pointer">Response time below</button><button type="button" style="min-height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid #D4D4D8; background: #FFFFFF; font: inherit; font-size: 12px; cursor: pointer">Validate JSON schema</button><button type="button" style="min-height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid #D4D4D8; background: #FFFFFF; font: inherit; font-size: 12px; cursor: pointer">Set environment variable</button></div>
</template>
<template data-sc="if" value="{{isParams}}" hint-placeholder-val="{{ false }}">
<table style="width: 100%; border-collapse: collapse; font-size: 13px"><thead><tr style="text-align: left; color: #55555D; border-bottom: 1px solid #E4E4E7"><th style="padding: 8px; font-weight: 600">Key</th><th style="padding: 8px; font-weight: 600">Value</th><th style="padding: 8px; font-weight: 600">Description</th></tr></thead><tbody>
<tr style="border-bottom: 1px solid #EEEEF0"><td style="padding: 8px; font-family: 'IBM Plex Mono', monospace">orderId</td><td style="padding: 8px; font-family: 'IBM Plex Mono', monospace">{{orderVar}}</td><td style="padding: 8px; color: #55555D">Path variable from environment</td></tr>
<tr><td style="padding: 8px; font-family: 'IBM Plex Mono', monospace">expand</td><td style="padding: 8px; font-family: 'IBM Plex Mono', monospace">items</td><td style="padding: 8px; color: #55555D">Include line items</td></tr>
</tbody></table>
</template>
<template data-sc="if" value="{{isAuth}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #3F3F46">Type<select style="min-height: 40px; padding: 0 10px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 400; background: #FFFFFF"><option>Inherit from collection (Bearer)</option><option>Bearer token</option><option>OAuth 2.0</option><option>API key</option><option>Basic</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #3F3F46">Token<input value="{{tokenVar}}" style="min-height: 40px; padding: 0 10px; border: 1px solid #D4D4D8; border-radius: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 400"></label>
</div>
<p style="margin: 10px 0 0; font-size: 12px; color: #55555D">accessToken is a secret variable, resolved from the vault at send time and masked in logs and reports.</p>
</template>
<template data-sc="if" value="{{isOther}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 13px; color: #55555D">{{otherNote}}</p>
</template>
</div>

<div style="border-top: 1px solid #E4E4E7; display: flex; flex-direction: column; flex: 1">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid #E4E4E7">
<div role="tablist" aria-label="Response sections" style="display: flex; gap: 2px"><button type="button" role="tab" aria-selected="true" style="min-height: 36px; padding: 0 12px; border: 0; border-bottom: 2px solid {{accent}}; background: transparent; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Body</button><button type="button" role="tab" aria-selected="false" style="min-height: 36px; padding: 0 12px; border: 0; background: transparent; color: #55555D; font: inherit; font-size: 13px; cursor: pointer">Headers (9)</button><button type="button" role="tab" aria-selected="false" style="min-height: 36px; padding: 0 12px; border: 0; background: transparent; color: #55555D; font: inherit; font-size: 13px; cursor: pointer">Test results (3/3)</button><button type="button" role="tab" aria-selected="false" style="min-height: 36px; padding: 0 12px; border: 0; background: transparent; color: #55555D; font: inherit; font-size: 13px; cursor: pointer">Timing</button></div>
<div style="display: flex; gap: 14px; font-size: 13px"><span style="font-weight: 700; color: #165C38">200 OK</span><span>214 ms</span><span>1.8 KB</span></div>
</div>
<div style="display: flex; flex-wrap: wrap; flex: 1">
<div style="flex: 3 1 340px; min-width: 0; padding: 12px 16px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 20px; white-space: pre; overflow-x: auto; background: #FAFAFA">{{responseBody}}</div>
<div style="flex: 2 1 220px; min-width: 0; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; border-left: 1px solid #E4E4E7">
<span style="font-size: 12px; font-weight: 600; color: #3F3F46">Test results</span>
<template data-sc="for" list="{{results}}" as="r" hint-placeholder-count="3"><div style="display: flex; gap: 8px; font-size: 13px"><span style="font-size: 11px; font-weight: 700; color: #165C38; width: 40px">PASS</span><span>{{r}}</span></div></template>
<span style="margin-top: 8px; font-size: 12px; font-weight: 600; color: #3F3F46">Timing</span>
<div style="display: flex; height: 10px; border-radius: 3px; overflow: hidden"><span style="width: 8%; background: #A1A1A8"></span><span style="width: 10%; background: #6B6B73"></span><span style="width: 16%; background: #3F3F46"></span><span style="width: 58%; background: #111113"></span><span style="width: 8%; background: {{accent}}"></span></div>
<span style="font-size: 11px; color: #55555D">DNS 17 · TCP 21 · TLS 34 · first byte 124 · download 18 ms</span>
</div>
</div>
</div>
</section>

<aside style="flex: 1 1 240px; min-width: 0; background: #FFFFFF; border-left: 1px solid #E4E4E7; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 14px; font-weight: 600">Linked test cases</h2>
<a href="test-case.html" style="padding: 10px; border-radius: 8px; background: #F5F5F6; color: #111113; text-decoration: none; font-size: 13px"><span style="font-family: 'IBM Plex Mono', monospace; color: #55555D">TC-3010</span> Get order returns current status</a>
<button type="button" style="min-height: 36px; border-radius: 8px; border: 1px dashed #8E8E96; background: #FFFFFF; font: inherit; font-size: 13px; cursor: pointer">Link test case</button>
</section>
<section style="display: flex; flex-direction: column; gap: 6px; font-size: 12px">
<h2 style="margin: 0 0 4px; font-size: 14px; font-weight: 600">Variables in scope</h2>
<template data-sc="for" list="{{vars}}" as="v" hint-placeholder-count="5"><div style="display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid #EEEEF0"><span style="font-family: 'IBM Plex Mono', monospace">{{v.name}}</span><span style="color: #55555D">{{v.scope}} · {{v.value}}</span></div></template>
