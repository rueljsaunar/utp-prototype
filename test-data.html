<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UTP Test Data</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B0102A}a:hover{color:#7A0A1C}
</style>
<style>:focus-visible{outline:3px solid #C8102E;outline-offset:2px}</style>
<script src="runtime.js" defer></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; color: #111113; background: #F5F5F6">

<nav aria-label="Main" style="flex: 1 1 240px; max-width: 100%; box-sizing: border-box; background: #0B0B0D; color: #FFFFFF; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<div style="width: 32px; height: 32px; border-radius: 8px; background: {{accent}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">U</div>
<div style="display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 16px; letter-spacing: 0.02em">UTP</span><span style="font-size: 11px; color: #A1A1A8">Unified Test Platform</span></div>
</div>
<button type="button" style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid #2A2A2F; background: #141417; color: #FFFFFF; font: inherit; font-size: 13px; cursor: pointer">Project: Customer Portal<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8E8E96; padding: 0 12px 6px">TEST MANAGEMENT</span>
<a href="index.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg></span>Dashboard</a>
<a href="requirements.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg></span>Requirements</a>
<a href="test-case.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M8 12l3 3 5-6"></path></svg></span>Test Cases</a>
<a href="test-data.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #FFFFFF; background: #222226; text-decoration: none; font-size: 14px; font-weight: 600"><span style="display: flex; color: {{accent}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></svg></span>Test Data</a>
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8E8E96; padding: 14px 12px 6px">AUTOMATION</span>
<a href="scripts.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"></path></svg></span>Scripts</a>
<a href="ai-studio.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg></span>AI Studio</a>
<a href="recorder.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle></svg></span>Recorder</a>
<a href="object-repository.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2l9 5v10l-9 5-9-5V7z"></path><path d="M12 22V12M21 7l-9 5-9-5"></path></svg></span>Object Repository</a>
<a href="framework-hub.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 20V4M3 8l4-4 4 4M17 4v16M13 16l4 4 4-4"></path></svg></span>Framework Hub</a>
<a href="api-testing.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1M16 3h1a2 2 0 0 1 2 2v5a2 2 0 0 0 2 2 2 2 0 0 0-2 2v5a2 2 0 0 1-2 2h-1"></path></svg></span>API Testing</a>
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8E8E96; padding: 14px 12px 6px">EXECUTION</span>
<a href="new-run.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 4l14 8-14 8z"></path></svg></span>New Run</a>
<a href="results.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span>Results</a>
<a href="devices.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"></rect><path d="M11 18h2"></path></svg></span>Devices</a>
<a href="report-builder.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12A9 9 0 1 1 12 3v9z"></path><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"></path></svg></span>Reports</a>
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8E8E96; padding: 14px 12px 6px">ADMIN</span>
<a href="integrations.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg></span>Integrations</a>
</div>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px; border-top: 1px solid #222226">
<div style="width: 32px; height: 32px; border-radius: 50%; background: #FFFFFF; color: #0B0B0D; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">QL</div>
<div style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600">QA Lead</span><span style="font-size: 11px; color: #A1A1A8">Admin access</span></div>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<div style="padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 16px; max-width: 1280px; box-sizing: border-box; width: 100%">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div><h1 style="margin: 0; font-size: 28px; font-weight: 700">Test Data</h1><p style="margin: 4px 0 0; font-size: 14px; color: #55555D">Reusable data sets, variables and generators for test cases, scripts and API tests</p></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #55555D">Environment<select onChange="{{pickEnv}}" style="min-height: 44px; padding: 0 10px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 14px; background: #FFFFFF; color: #111113"><option value="staging">staging</option><option value="qa">qa</option></select></label>
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #111113; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Import CSV / Excel</button>
<button type="button" style="min-height: 44px; padding: 0 18px; border-radius: 8px; border: 0; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">New data set</button>
</div>
</div>

<div role="tablist" aria-label="Test data sections" style="display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid #E4E4E7">
<template data-sc="for" list="{{tabs}}" as="t" hint-placeholder-count="4"><button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="min-height: 44px; padding: 0 16px; border: 0; border-bottom: {{t.border}}; background: transparent; color: {{t.fg}}; font: inherit; font-size: 14px; font-weight: {{t.weight}}; cursor: pointer">{{t.label}}</button></template>
</div>

<template data-sc="if" value="{{isSets}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<aside aria-label="Data sets" style="flex: 1 1 200px; background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 4px">
<label style="display: flex; padding: 0 2px 8px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search data sets</span><input type="search" placeholder="Search data sets" style="flex: 1; min-height: 36px; padding: 0 10px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 13px"></label>
<template data-sc="for" list="{{setList}}" as="s" hint-placeholder-count="7">
<template data-sc="if" value="{{s.isFolder}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 600; color: #55555D; padding: 8px 8px 2px">{{s.name}}</span></template>
<template data-sc="if" value="{{s.isSet}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{s.pick}}" style="display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 6px; background: {{s.bg}}; color: {{s.fg}}; font: inherit; font-size: 13px; text-align: left; cursor: pointer"><span style="font-family: 'IBM Plex Mono', monospace">{{s.name}}</span><span style="font-size: 11px; color: {{s.mc}}">{{s.meta}}</span></button></template>
</template>
</aside>

<section aria-label="Data set editor" style="flex: 4 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 10px">
<div><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><h2 style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600">{{cur.name}}</h2><span style="padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #F0F0F2">{{cur.kind}}</span><span style="padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #E7F4EC; color: #165C38">Synthetic</span><span style="font-size: 12px; color: #55555D">{{cur.version}}</span></div><p style="margin: 4px 0 0; font-size: 13px; color: #55555D">{{cur.desc}}</p></div>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><button type="button" style="min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #111113; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Add row</button><button type="button" style="min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #D4D4D8; background: #FFFFFF; font: inherit; font-size: 13px; cursor: pointer">Add column</button><button type="button" style="min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #D4D4D8; background: #FFFFFF; font: inherit; font-size: 13px; cursor: pointer">Export</button></div>
</div>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 640px; border-collapse: collapse; font-size: 13px">
<thead><tr style="text-align: left; border-bottom: 1px solid #E4E4E7"><template data-sc="for" list="{{cur.cols}}" as="c" hint-placeholder-count="5"><th style="padding: 8px; vertical-align: bottom"><div style="font-weight: 600; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px">{{c.name}}</div><div style="font-size: 11px; font-weight: 600; color: {{c.tc}}">{{c.type}}</div></th></template></tr></thead>
<tbody>
<template data-sc="for" list="{{cur.rows}}" as="r" hint-placeholder-count="4">
<tr style="border-bottom: 1px solid #EEEEF0"><template data-sc="for" list="{{r.cells}}" as="cell" hint-placeholder-count="5"><td style="padding: 6px 8px; background: {{cell.bg}}"><div style="font-family: {{cell.font}}; font-size: 12.5px; font-weight: {{cell.weight}}">{{cell.v}}</div><div style="font-size: 10.5px; color: {{cell.nc}}">{{cell.note}}</div></td></template></tr>
</template>
</tbody>
</table>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: #55555D">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #FFF1DB"></span>Value set for this environment</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #F0F0F2"></span>Secret from vault (masked)</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; border: 1px dashed #8E8E96"></span>Generated at run time</span>
</div>
<div role="status" style="display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 8px; background: #E7F4EC; color: #165C38; font-size: 13px"><strong>PII scan passed.</strong><span>No real-looking personal data found; emails use the reserved example.test domain.</span></div>
</section>

<aside style="flex: 2 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<section style="background: #0B0B0D; color: #ECECEE; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 14px; font-weight: 600; color: #FFFFFF">Use this data</h2>
<div role="tablist" aria-label="Usage language" style="display: flex; flex-wrap: wrap; gap: 4px">
<template data-sc="for" list="{{langs}}" as="l" hint-placeholder-count="5"><button type="button" role="tab" aria-selected="{{l.on}}" onClick="{{l.pick}}" style="min-height: 32px; padding: 0 10px; border-radius: 6px; border: 0; background: {{l.bg}}; color: #FFFFFF; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer">{{l.label}}</button></template>
</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; line-height: 19px; white-space: pre; overflow-x: auto; padding: 10px; border-radius: 8px; background: #1A1A1D">{{snippet}}</div>
<button type="button" style="align-self: flex-start; min-height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid #3F3F46; background: transparent; color: #FFFFFF; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer">Copy reference</button>
</section>
<section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 8px; font-size: 13px">
<h2 style="margin: 0 0 2px; font-size: 14px; font-weight: 600">Used by</h2>
<template data-sc="for" list="{{cur.usage}}" as="u" hint-placeholder-count="4"><a href="{{u.href}}" style="display: flex; justify-content: space-between; gap: 8px; padding: 8px; border-radius: 6px; background: #F5F5F6; color: #111113; text-decoration: none"><span>{{u.name}}</span><span style="font-size: 12px; color: #55555D">{{u.kind}}</span></a></template>
<span style="font-size: 12px; color: #55555D">Deleting a column warns about every consumer first.</span>
</section>
<section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 6px; font-size: 13px">
<h2 style="margin: 0 0 2px; font-size: 14px; font-weight: 600">Version history</h2>
<span style="display: flex; justify-content: space-between"><strong>{{cur.version}} · current</strong><span style="color: #55555D">today</span></span>
<span style="display: flex; justify-content: space-between"><span>Previous version</span><button type="button" style="min-height: 28px; padding: 0 8px; border-radius: 6px; border: 1px solid #D4D4D8; background: #FFFFFF; font: inherit; font-size: 12px; cursor: pointer">Compare</button></span>
<span style="font-size: 12px; color: #55555D">Each run stores the snapshot it used, for exact re-runs.</span>
</section>
</aside>
</div>
</template>

<template data-sc="if" value="{{isVars}}" hint-placeholder-val="{{ false }}">
<section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-size: 16px; font-weight: 600">Variables</h2><button type="button" style="min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #111113; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Add variable</button></div>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 620px; border-collapse: collapse; font-size: 13px">
<thead><tr style="text-align: left; color: #55555D; border-bottom: 1px solid #E4E4E7"><th style="padding: 8px; font-weight: 600">Reference</th><th style="padding: 8px; font-weight: 600">Scope</th><th style="padding: 8px; font-weight: 600">staging</th><th style="padding: 8px; font-weight: 600">qa</th></tr></thead>
<tbody><template data-sc="for" list="{{vars}}" as="v" hint-placeholder-count="5"><tr style="border-bottom: 1px solid #EEEEF0"><td style="padding: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px">{{v.ref}}</td><td style="padding: 8px">{{v.scope}}</td><td style="padding: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px">{{v.s}}</td><td style="padding: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px">{{v.q}}</td></tr></template></tbody>
</table>
</div>
</section>
</template>

<template data-sc="if" value="{{isGens}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px">
<template data-sc="for" list="{{gens}}" as="g" hint-placeholder-count="6"><section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600">{{g.ref}}</span><span style="font-size: 13px; color: #3F3F46">{{g.desc}}</span><span style="font-size: 12px; color: #55555D">Preview: <span style="font-family: 'IBM Plex Mono', monospace; color: #111113">{{g.sample}}</span></span></section></template>
</div>
</template>

<template data-sc="if" value="{{isPools}}" hint-placeholder-val="{{ false }}">
<section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px">

<script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8102E';
    const st = this.state || {};
    const tab = st.tab || 'sets';
    const env = st.env || 'staging';
    const setId = st.set || 'users';
    const lang = st.lang || 'case';
    const TYPE = { key: '#3F3F46', string: '#3F3F46', email: '#3F3F46', enum: '#3F3F46', number: '#3F3F46', secret: '#A00C25', generated: '#8A5300' };
    const plain = (v) => ({ v, note: '', bg: 'transparent', font: "'IBM Plex Sans', sans-serif", weight: 400, nc: '#55555D' });
    const key = (v) => ({ ...plain(v), font: "'IBM Plex Mono', monospace", weight: 600 });
    const envv = (vals) => ({ v: vals[env], note: env + ' value', bg: '#FFF1DB', font: "'IBM Plex Mono', monospace", weight: 400, nc: '#8A5300' });
    const secret = (path) => ({ v: '••••••••', note: 'vault: ' + path, bg: '#F0F0F2', font: "'IBM Plex Mono', monospace", weight: 400, nc: '#55555D' });
    const gen = (rule) => ({ v: rule, note: 'generated per run', bg: 'transparent', font: "'IBM Plex Mono', monospace", weight: 400, nc: '#8A5300' });
    const SETS = {
      users: {
        name: 'users', kind: 'Table', version: 'v7', desc: 'Sign-in personas for web, mobile and API tests',
        cols: [['role', 'key'], ['email', 'email'], ['password', 'secret'], ['displayName', 'string'], ['locale', 'enum']],
        rows: [
          [key('standard'), envv({ staging: 'standard@example.test', qa: 'standard.qa@example.test' }), secret('users/standard'), plain('Ana Test'), plain('en-US')],
          [key('admin'), envv({ staging: 'admin@example.test', qa: 'admin.qa@example.test' }), secret('users/admin'), plain('Ben Sample'), plain('en-GB')],
          [key('locked'), plain('locked@example.test'), secret('users/locked'), plain('Cara Demo'), plain('fil-PH')],
          [key('new'), gen('{{gen.email}}'), gen('{{gen.password:12}}'), gen('{{gen.name}}'), plain('en-US')]
        ],
        usage: [
          { name: 'TC-1042 User can log in', kind: 'test case', href: 'test-case.html' },
          { name: 'tests/auth/login.spec.ts', kind: 'script', href: 'scripts.html' },
          { name: 'Get access token', kind: 'API request', href: 'api-testing.html' },
          { name: 'mobile/auth/login.e2e.ts', kind: 'script', href: 'scripts.html' }
        ]
      },
      orders: {
        name: 'orders', kind: 'Table', version: 'v3', desc: 'Orders in known states, for order history and status tests',
        cols: [['id', 'key'], ['status', 'enum'], ['sku', 'string'], ['qty', 'number'], ['total', 'number']],
        rows: [
          [envv({ staging: 'ORD-10482', qa: 'ORD-20117' }), plain('open'), plain('SKU-221'), plain('2'), plain('59.90')],
          [envv({ staging: 'ORD-10483', qa: 'ORD-20118' }), plain('shipped'), plain('SKU-087'), plain('1'), plain('19.00')],
          [envv({ staging: 'ORD-10490', qa: 'ORD-20125' }), plain('returned'), plain('SKU-145'), plain('3'), plain('74.25')]
        ],
        usage: [
          { name: 'TC-0930 Order history lists recent orders', kind: 'test case', href: 'test-case.html' },
          { name: 'Orders API regression', kind: 'API collection', href: 'api-testing.html' }
        ]
      },
      checkout: {
        name: 'checkout.defaults', kind: 'Key-value', version: 'v2', desc: 'Default values for checkout tests',
        cols: [['key', 'key'], ['value', 'string'], ['note', 'string']],
        rows: [
          [key('currency'), plain('USD'), plain('Store default')],
          [key('shippingMethod'), plain('standard'), plain('Cheapest option')],
          [key('promoCode'), gen('{{gen.regex:[A-Z]{4}10}}'), plain('Valid 10% code shape')],
          [key('testCard'), plain('4111 1111 1111 1111'), plain('Public test card number')]
        ],
        usage: [
          { name: 'TC-0870 Guest checkout with card', kind: 'test case', href: 'test-case.html' },
          { name: 'tests/checkout/promo-code.spec.ts', kind: 'script', href: 'scripts.html' }
        ]
      },
      accounts: {
        name: 'new_accounts', kind: 'Pool', version: 'v1', desc: 'Single-use accounts for registration tests',
        cols: [['id', 'key'], ['email', 'email'], ['state', 'enum']],
        rows: [
          [key('acc-0071'), plain('acc0071@example.test'), plain('available')],
          [key('acc-0072'), plain('acc0072@example.test'), plain('leased · RUN-1290')],
          [key('acc-0041'), plain('acc0041@example.test'), plain('consumed')]
        ],
        usage: [{ name: 'TC-1101 New user can register', kind: 'test case', href: 'test-case.html' }]
      }
    };
    const cur = SETS[setId];
    const SNIP = {
      users: {
        case: 'Test data field in a step:\n{{data.users[standard].email}}\n\nData-driven case:\nbind to users, rows standard, admin',
        ts: "const user = data.row('users', 'standard');\nawait login.fill(user.email, user.password);",
        pytest: 'user = row("users", "standard")\nlogin_page.sign_in(user["email"], user["password"])',
        behave: 'Scenario Outline: Sign in as <role>\n  Examples: users\n    | role     |\n    | standard |\n    | admin    |',
        api: 'Body:\n{ "username": "{{data.users[standard].email}}" }'
      },
      orders: {
        case: 'Data-driven case:\nbind to orders, filter status=open\n\n{{data.orders[*].id}}',
        ts: "for (const o of data.rows('orders', { status: 'open' })) {\n  test(`view ${o.id}`, async ({ page }) => { … });\n}",
        pytest: '@pytest.mark.parametrize("o", rows("orders", status="open"))\ndef test_view_order(page, o): ...',
        behave: 'Examples: orders (status = open)\n  | id        | sku     |\n  | ORD-10482 | SKU-221 |',
        api: 'Collection run iteration data:\norders (3 rows) → {{id}}, {{status}}'
      },
      checkout: {
        case: '{{data.checkout.defaults.currency}}\n{{data.checkout.defaults.promoCode}}',
        ts: "const promo = data.value('checkout.defaults', 'promoCode');",
        pytest: 'promo = value("checkout.defaults", "promoCode")',
        behave: 'When the user applies the default promo code',
        api: '{{data.checkout.defaults.currency}}'
      },
      accounts: {
        case: '{{pool.new_accounts.email}}\n(one row leased per test)',
        ts: "const acc = await data.lease('new_accounts');",
        pytest: 'acc = lease("new_accounts")',
        behave: 'Given a fresh account from the pool',
        api: '{{pool.new_accounts.email}}'
      }
    };
    const setRow = (id, name, meta) => ({ isSet: true, isFolder: false, name, meta, bg: id === setId ? '#0B0B0D' : 'transparent', fg: id === setId ? '#FFFFFF' : '#111113', mc: id === setId ? '#C4C4CA' : '#55555D', pick: () => this.setState({ set: id }) });
    const folder = (name) => ({ isSet: false, isFolder: true, name });
    return {
      accent,
      pickEnv: (e) => this.setState({ env: e.target.value }),
      tabs: [['sets', 'Data sets'], ['vars', 'Variables'], ['gens', 'Generators'], ['pools', 'Pools']].map(([id, label]) => ({ label, on: id === tab ? 'true' : 'false', fg: id === tab ? '#111113' : '#55555D', weight: id === tab ? 700 : 400, border: id === tab ? '3px solid ' + accent : '3px solid transparent', pick: () => this.setState({ tab: id }) })),
      isSets: tab === 'sets', isVars: tab === 'vars', isGens: tab === 'gens', isPools: tab === 'pools',
      setList: [folder('Accounts'), setRow('users', 'users', '4 rows'), setRow('accounts', 'new_accounts', 'pool · 62'), folder('Commerce'), setRow('orders', 'orders', '3 rows'), setRow('checkout', 'checkout.defaults', 'key-value')],
      cur: {
        ...cur,
        cols: cur.cols.map(([name, type]) => ({ name, type, tc: TYPE[type] })),
        rows: cur.rows.map((cells) => ({ cells }))
      },
      langs: [['case', 'Test case'], ['ts', 'Playwright TS'], ['pytest', 'pytest'], ['behave', 'behave'], ['api', 'API']].map(([id, label]) => ({ label, on: id === lang ? 'true' : 'false', bg: id === lang ? accent : '#2A2A2F', pick: () => this.setState({ lang: id }) })),
      snippet: SNIP[setId][lang],
      vars: [
        { ref: '{{var.baseUrl}}', scope: 'environment', s: '[STAGING_BASE_URL]', q: '[QA_BASE_URL]' },
        { ref: '{{var.apiVersion}}', scope: 'project', s: 'v2', q: 'v2' },
        { ref: '{{var.defaultTimeoutMs}}', scope: 'project', s: '10000', q: '15000' },
        { ref: '{{var.featureFlags.newCheckout}}', scope: 'environment', s: 'true', q: 'false' },
        { ref: '{{secret.payments.apiKey}}', scope: 'environment (vault)', s: '•••••••• masked', q: '•••••••• masked' }
      ],
      gens: [
        { ref: '{{gen.email}}', desc: 'Unique email on the reserved example.test domain', sample: 'u7f3k2@example.test' },
        { ref: '{{gen.name}}', desc: 'Synthetic full name for the project locale', sample: 'Dana Placeholder' },
        { ref: '{{gen.seq:ORD-}}', desc: 'Sequence with prefix, unique per run', sample: 'ORD-00042' },
        { ref: '{{gen.date:+7d}}', desc: 'Date offset from today, ISO format', sample: '2026-11-19' },
        { ref: '{{gen.regex:[A-Z]{3}[0-9]{4}}}', desc: 'Value matching a pattern', sample: 'KQT4821' },
        { ref: '{{gen.card:visa}}', desc: 'Public test card number that passes Luhn checks', sample: '4111 1111 1111 1111' }
      ]
    };
  }
}
</script>
<script type="application/json" id="props">{"accent": "#C8102E"}</script>
