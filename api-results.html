<div style="padding: 22px 32px 40px; display: flex; flex-direction: column; gap: 16px; max-width: 1280px; box-sizing: border-box; width: 100%">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch">
<section style="flex: 3 1 520px; min-width: 0; background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 10px">

<template data-sc="for" list="{{endpoints}}" as="e" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 10px; font-size: 12px">
<span style="width: 170px; flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px">{{e.name}}</span>
<div style="position: relative; flex: 1; height: 18px; background: #F5F5F6; border-radius: 3px">
<span style="position: absolute; left: 0; top: 0; height: 18px; width: {{e.p95w}}; background: #A1A1A8; border-radius: 3px"></span>

<span style="position: absolute; left: 66.7%; top: -3px; width: 2px; height: 24px; background: {{accent}}"></span>
</div>
<span style="width: 96px; flex: none; text-align: right; font-weight: {{e.fw}}; color: {{e.tc}}">{{e.p50}} / {{e.p95}}</span>
</div>
</template>
</section>
<section style="flex: 1 1 260px; min-width: 0; background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">Status codes</h2>
<div style="display: flex; height: 22px; border-radius: 4px; overflow: hidden"><span style="width: 95.2%; background: #111113"></span><span style="width: 2.4%; background: #E0A040"></span><span style="width: 2.4%; background: {{accent}}"></span></div>
<div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px">
<span style="display: flex; justify-content: space-between"><span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; background: #111113; border-radius: 2px"></span>2xx</span><strong>40</strong></span>
<span style="display: flex; justify-content: space-between"><span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; background: #E0A040; border-radius: 2px"></span>4xx</span><strong>1</strong></span>
<span style="display: flex; justify-content: space-between"><span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; background: {{accent}}; border-radius: 2px"></span>5xx</span><strong>1</strong></span>
</div>
<h2 style="margin: 6px 0 0; font-size: 15px; font-weight: 600">Iteration matrix</h2>
<div style="display: grid; grid-template-columns: 34px repeat(7, minmax(0, 1fr)); gap: 4px; font-size: 11px; color: #55555D">
<template data-sc="for" list="{{matrix}}" as="row" hint-placeholder-count="3"><span style="display: flex; align-items: center">{{row.label}}</span><template data-sc="for" list="{{row.cells}}" as="c" hint-placeholder-count="7"><span title="{{c.t}}" style="height: 20px; border-radius: 3px; background: {{c.bg}}"></span></template></template>
</div>
</section>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<section style="flex: 3 1 520px; min-width: 0; background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">Requests</h2>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 560px; border-collapse: collapse; font-size: 13px">
<thead><tr style="text-align: left; color: #55555D; border-bottom: 1px solid #E4E4E7"><th style="padding: 8px; font-weight: 600">Request</th><th style="padding: 8px; font-weight: 600">Iteration</th><th style="padding: 8px; font-weight: 600">Status</th><th style="padding: 8px; font-weight: 600">Time</th><th style="padding: 8px; font-weight: 600">Assertions</th></tr></thead>

<tr style="border-bottom: 1px solid #EEEEF0; background: {{r.rowBg}}"><td style="padding: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; color: {{r.mc}}">{{r.method}}</span> <span style="font-weight: 600">{{r.name}}</span></td><td style="padding: 8px">{{r.it}}</td><td style="padding: 8px; font-weight: 700; color: {{r.sc}}">{{r.status}}</td><td style="padding: 8px">{{r.time}}</td><td style="padding: 8px"><span style="padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: {{r.bg}}; color: {{r.fg}}">{{r.asserts}}</span></td></tr>
</template>
</tbody>
</table>
</div>
</section>

<section aria-label="Failed request detail" style="flex: 2 1 380px; min-width: 0; background: #FFFFFF; border: 2px solid {{accent}}; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<div><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #55555D">PATCH · iteration 2 · row 2 of orders.csv</span><h2 style="margin: 2px 0 0; font-size: 16px; font-weight: 700">Update order status</h2></div>
<div style="display: flex; gap: 8px; align-items: flex-start; padding: 10px; border-radius: 8px; background: #FBE5E9; color: #A00C25; font-size: 13px"><strong>FAIL</strong><span>status is 200 · expected response to have status code 200 but got 500</span></div>
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px"><legend style="font-size: 12px; font-weight: 600; color: #3F3F46; padding-bottom: 6px">Show in this view</legend>
<template data-sc="for" list="{{fields}}" as="f" hint-placeholder-count="4"><button type="button" aria-pressed="{{f.on}}" onClick="{{f.toggle}}" style="min-height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid #111113; background: {{f.bg}}; color: {{f.fg}}; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer">{{f.label}}</button></template>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600; color: #3F3F46">Request body</span><div style="background: #0B0B0D; color: #ECECEE; border-radius: 6px; padding: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; white-space: pre">{{reqBody}}</div></div>
</template>

<template data-sc="if" value="{{showHead}}" hint-placeholder-val="{{ false }}">

</template>
<span style="font-size: 12px; color: #55555D">Linked: <a href="test-case.html" style="font-weight: 600">TC-3014 Order status can be changed</a> · tokens and cookies redacted</span>
</section>

</div>

<script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8102E';
    const st = this.state || {};
    const on = (k, d) => (st[k] === undefined ? d : st[k]);
    const showReq = on('req', true), showRes = on('res', true), showHead = on('head', false), showConsole = on('con', false);
    const max = 1200;
    const ep = (name, p50, p95) => ({ name, p50: p50 + ' ms', p95: p95 + ' ms', p50w: (p50 / max * 100).toFixed(1) + '%', p95w: (Math.min(p95, max) / max * 100).toFixed(1) + '%', fw: p95 > 800 ? 700 : 400, tc: p95 > 800 ? '#A00C25' : '#111113' });
    const M = { GET: '#165C38', POST: '#8A5300', PATCH: '#3F3F46', DELETE: '#A00C25' };
    const req = (method, name, it, status, time, asserts, ok) => ({ method, name, it, status, time, asserts, mc: M[method], sc: status >= 500 ? '#A00C25' : (status >= 400 ? '#8A5300' : '#165C38'), bg: ok ? '#E7F4EC' : '#FBE5E9', fg: ok ? '#165C38' : '#A00C25', rowBg: ok ? 'transparent' : '#FDF3F5' });
    const P = { bg: '#111113', t: 'Passed' }, F = { bg: accent, t: 'Failed' }, W = { bg: '#E0A040', t: '4xx response' };
    const field = (key, label, val) => ({ label, on: val ? 'true' : 'false', bg: val ? '#0B0B0D' : '#FFFFFF', fg: val ? '#FFFFFF' : '#111113', toggle: () => this.setState({ [key]: !val }) });
    return {
      accent, showReq, showRes, showHead, showConsole,
      fields: [field('req', 'Request body', showReq), field('res', 'Response body', showRes), field('head', 'Headers', showHead), field('con', 'Console', showConsole)],
      endpoints: [
        ep('POST /auth/token', 180, 260),
        ep('GET /orders', 210, 480),
        ep('GET /orders/{id}', 190, 350),
        ep('POST /orders', 320, 690),
        ep('PATCH /orders/{id}', 280, 1204),
        ep('GET /products/search', 540, 1120)
      ],
      matrix: [
        { label: 'It 1', cells: [P, P, P, P, P, P, P] },
        { label: 'It 2', cells: [P, P, P, P, F, P, P] },
        { label: 'It 3', cells: [P, P, P, W, P, P, P] }
      ],
      requests: [
        req('POST', 'Get access token', 1, 200, '182 ms', '2/2', true),
        req('GET', 'List orders', 1, 200, '214 ms', '3/3', true),
        req('PATCH', 'Update order status', 2, 500, '1,204 ms', '1/2', false),
        req('POST', 'Create order', 3, 422, '301 ms', '1/2', false),
        req('GET', 'Get order by id', 3, 200, '188 ms', '3/3', true),
        req('GET', 'Search products', 3, 200, '1,120 ms', '2/2', true),
        req('DELETE', 'Cancel order', 3, 204, '160 ms', '1/1', true)
      ],
      reqBody: '{\n  "status": "RETURNED",\n  "reason": "{{returnReason}}"\n}',
      resBody: '{\n  "error": "InternalServerError",\n  "message": "transition not allowed",\n  "traceId": "[trace-id]"\n}'
    };
  }
}
</script>
<script type="application/json" id="props">{"accent": "#C8102E"}</script>
