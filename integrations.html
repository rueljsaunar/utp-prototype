<div style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600">QA Lead</span><span style="font-size: 11px; color: #A1A1A8">Admin access</span></div>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<div style="padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 18px; max-width: 1280px; box-sizing: border-box; width: 100%">
<div><h1 style="margin: 0; font-size: 28px; font-weight: 700">Integrations and settings</h1><p style="margin: 4px 0 0; font-size: 14px; color: #55555D">Connections, environments, AI controls and access for Customer Portal</p></div>

<div role="tablist" aria-label="Settings sections" style="display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid #E4E4E7">
<button type="button" role="tab" aria-selected="true" style="min-height: 44px; padding: 0 16px; border: 0; border-bottom: 3px solid {{accent}}; background: transparent; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Integrations</button>
<button type="button" role="tab" aria-selected="false" style="min-height: 44px; padding: 0 16px; border: 0; background: transparent; color: #55555D; font: inherit; font-size: 14px; cursor: pointer">Environments</button>
<button type="button" role="tab" aria-selected="false" style="min-height: 44px; padding: 0 16px; border: 0; background: transparent; color: #55555D; font: inherit; font-size: 14px; cursor: pointer">AI settings</button>
<button type="button" role="tab" aria-selected="false" style="min-height: 44px; padding: 0 16px; border: 0; background: transparent; color: #55555D; font: inherit; font-size: 14px; cursor: pointer">Users and roles</button>
<button type="button" role="tab" aria-selected="false" style="min-height: 44px; padding: 0 16px; border: 0; background: transparent; color: #55555D; font: inherit; font-size: 14px; cursor: pointer">API tokens and webhooks</button>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px">
<template data-sc="for" list="{{integrations}}" as="i" hint-placeholder-count="8">
<section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 12px"><span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 8px; background: #0B0B0D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">{{i.mono}}</span><div style="display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 14px">{{i.name}}</span><span style="font-size: 12px; color: #55555D">{{i.kind}}</span></div></div>
<p style="margin: 0; font-size: 13px; color: #3F3F46">{{i.desc}}</p>
<div style="display: flex; justify-content: space-between; align-items: center; margin-top: auto"><span style="padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{i.bg}}; color: {{i.fg}}">{{i.status}}</span><button type="button" style="min-height: 36px; padding: 0 12px; border-radius: 8px; border: {{i.btnBorder}}; background: {{i.btnBg}}; color: {{i.btnFg}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{i.action}}</button></div>
</section>
</template>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<section style="flex: 1 1 380px; background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">AI settings</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #3F3F46">Provider<select style="min-height: 40px; padding: 0 10px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 400; background: #FFFFFF"><option>Anthropic Claude</option><option>Other provider</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #3F3F46">Monthly token budget<input value="20,000,000" style="min-height: 40px; padding: 0 10px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 400"></label>
</div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; justify-content: space-between; font-size: 13px"><span>Used this month</span><span style="font-weight: 600">6.4M of 20M</span></div><div style="height: 8px; border-radius: 4px; background: #EEEEF0; overflow: hidden"><div style="width: 32%; height: 8px; background: #111113"></div></div></div>
<label style="display: flex; align-items: center; gap: 10px; font-size: 13px"><input type="checkbox" checked="" style="accent-color: {{accent}}; width: 18px; height: 18px">Redact PII and secrets before any AI call</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 13px"><input type="checkbox" checked="" style="accent-color: {{accent}}; width: 18px; height: 18px">Require human approval for AI scripts</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 13px"><input type="checkbox" style="accent-color: {{accent}}; width: 18px; height: 18px">Allow locator self-healing PRs</label>
<button type="button" style="align-self: flex-start; min-height: 44px; padding: 0 18px; border-radius: 8px; border: 0; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Save AI settings</button>
</section>

<section style="flex: 1 1 460px; min-width: 0; background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-size: 16px; font-weight: 600">Environments</h2><button type="button" style="min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #111113; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Add environment</button></div>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 460px; border-collapse: collapse; font-size: 13px">
<thead><tr style="text-align: left; color: #55555D; border-bottom: 1px solid #E4E4E7"><th style="padding: 8px; font-weight: 600">Name</th><th style="padding: 8px; font-weight: 600">Base URL</th><th style="padding: 8px; font-weight: 600">Secrets</th><th style="padding: 8px; font-weight: 600">BrowserStack Local</th></tr></thead>
<tbody>
<tr style="border-bottom: 1px solid #EEEEF0"><td style="padding: 10px 8px; font-weight: 600">staging</td><td style="padding: 10px 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px">[STAGING_BASE_URL]</td><td style="padding: 10px 8px">8 in Vault</td><td style="padding: 10px 8px">Tunnel on</td></tr>
<tr style="border-bottom: 1px solid #EEEEF0"><td style="padding: 10px 8px; font-weight: 600">qa</td><td style="padding: 10px 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px">[QA_BASE_URL]</td><td style="padding: 10px 8px">8 in Vault</td><td style="padding: 10px 8px">Tunnel on</td></tr>
<tr><td style="padding: 10px 8px; font-weight: 600">production-readonly</td><td style="padding: 10px 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px">[PROD_BASE_URL]</td><td style="padding: 10px 8px">2 in Vault</td><td style="padding: 10px 8px">Off</td></tr>
</tbody>
</table>
</div>
<p style="margin: 0; font-size: 12px; color: #55555D">Secret values are never shown here; scripts read them by name at run time.</p>
</section>
</div>
</div>
</main>
</div>
</template>
<script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8102E';
    const on = { status: 'Connected', bg: '#E7F4EC', fg: '#165C38', action: 'Configure', btnBorder: '1px solid #D4D4D8', btnBg: '#FFFFFF', btnFg: '#111113' };
    const off = { status: 'Not connected', bg: '#EEEEF0', fg: '#3F3F46', action: 'Connect', btnBorder: '0', btnBg: accent, btnFg: '#FFFFFF' };
    const it = (mono, name, kind, desc, state) => ({ mono, name, kind, desc, ...state });
    return {
      accent,
      integrations: [
        it('BS', 'BrowserStack', 'Device cloud', 'Automate for Playwright, App Automate for Appium, Local tunnel for staging.', on),
        it('JI', 'Jira Cloud', 'Issue tracking', 'Sync stories as requirements and raise defects from failed results.', on),
        it('GH', 'GitHub', 'Source control and CI', 'Script repo sync, framework export through pull requests, and the UTP run action.', on),
        it('AI', 'Anthropic Claude', 'LLM provider', 'Script generation, failure analysis and test case suggestions.', on),
        it('SL', 'Slack', 'Notifications', 'Run completion and pass-rate alerts to team channels.', on),
        it('VA', 'HashiCorp Vault', 'Secrets', 'Environment credentials and integration keys, read at run time.', on),
        it('ID', 'Single sign-on', 'OIDC / SAML', 'Company identity provider with group-to-role mapping.', on),
        it('PM', 'Postman', 'API workspace sync', 'Pull and push collections and environments through the Postman API.', off),
        it('MT', 'Microsoft Teams', 'Notifications', 'Post run summaries to Teams channels.', off)
      ]
    };
  }
}
</script>
<script type="application/json" id="props">{"accent": "#C8102E"}</script>
</body>
