<script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8102E';
    const tok = (line) => {
      const out = [];
      const re = /('[^']*')|\b(import|from|const|new|await|async)\b/g;
      let last = 0, m;
      while ((m = re.exec(line))) {
        if (m.index > last) out.push({ t: line.slice(last, m.index), c: '#ECECEE' });
        out.push({ t: m[0], c: m[1] ? '#F7B4C0' : '#FF6B83' });
        last = re.lastIndex;
      }
      if (last < line.length) out.push({ t: line.slice(last), c: '#ECECEE' });
      if (!out.length) out.push({ t: ' ', c: '#ECECEE' });
      return out;
    };
    const src = [
      "import { test, expect } from '@playwright/test';",
      "import { LoginPage } from '../pages/login.page';",
      "",
      "test('User can log in with valid credentials',",
      "  { tag: ['@smoke', '@auth'], annotation: { type: 'utp', description: 'TC-1042' } },",
      "  async ({ page }) => {",
      "    const login = new LoginPage(page);",
      "    await test.step('Open the login page', async () => {",
      "      await login.goto();",
      "      await expect(login.form).toBeVisible();",
      "    });",
      "    await test.step('Enter username and password', async () => {",
      "      await login.fill(process.env.USER_STANDARD!, process.env.USER_STANDARD_PWD!);",
      "    });",
      "    await test.step('Click Sign in', async () => {",
      "      await login.submit();",
      "      await expect(page.getByTestId('user-name')).toBeVisible();",
      "    });",
      "  });"
    ];
    const file = (name, depth, tag, active) => ({
      name, tag, indent: (8 + depth * 14) + 'px',
      bg: active ? '#0B0B0D' : 'transparent', fg: active ? '#FFFFFF' : '#111113',
      tagc: tag === 'AI draft' ? '#A00C25' : (active ? '#C4C4CA' : '#55555D')
    });
    return {
      accent,
      code: src.map((s, i) => ({ n: i + 1, seg: tok(s) })),
      files: [
        file('tests/', 0, '', false),
        file('auth/', 1, '', false),
        file('login.spec.ts', 2, 'TC-1042', true),
        file('reset-password.spec.ts', 2, 'TC-1050', false),
        file('sso.spec.ts', 2, 'AI draft', false),
        file('checkout/', 1, '', false),
        file('guest-checkout.spec.ts', 2, 'TC-0870', false),
        file('promo-code.spec.ts', 2, 'Flaky', false),
        file('pages/', 0, '', false),
        file('login.page.ts', 1, '', false),
        file('checkout.page.ts', 1, '', false),
        file('mobile/', 0, '', false),
        file('auth/login.e2e.ts', 1, 'AI draft', false),
        file('fixtures/', 0, '', false),
        file('playwright.config.ts', 0, '', false)
      ]
    };
  }
}
</script>
