<nav aria-label="Main" style="flex: 1 1 240px; max-width: 100%; box-sizing: border-box; background: #0B0B0D; color: #FFFFFF; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px">

</div>

<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8E8E96; padding: 14px 12px 6px">AUTOMATION</span>
<a href="scripts.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg></span>Scripts</a>
<a href="ai-studio.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg></span>AI Studio</a>

<a href="object-repository.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 22V12M21 7l-9 5-9-5"/></svg></span>Object Repository</a>

<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8E8E96; padding: 14px 12px 6px">EXECUTION</span>

<a href="results.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>Results</a>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<div style="padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 16px; max-width: 1280px; box-sizing: border-box; width: 100%">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div><div style="font-size: 13px; color: #55555D"><a href="api-testing.html" style="color: #55555D">API Testing</a> / Import and export</div><h1 style="margin: 4px 0 0; font-size: 28px; font-weight: 700">Postman import and export</h1></div>
<div role="tablist" aria-label="Direction" style="display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E4E4E7">
<button type="button" role="tab" aria-selected="{{impOn}}" onClick="{{pickImp}}" style="min-height: 40px; padding: 0 18px; border-radius: 7px; border: 0; background: {{impBg}}; color: {{impFg}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Import</button>
<button type="button" role="tab" aria-selected="{{expOn}}" onClick="{{pickExp}}" style="min-height: 40px; padding: 0 18px; border-radius: 7px; border: 0; background: {{expBg}}; color: {{expFg}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Export</button>
</div>
</div>

<template data-sc="if" value="{{isImport}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<div style="flex: 3 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">Source</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-sc="for" list="{{sources}}" as="s" hint-placeholder-count="7"><button type="button" aria-pressed="{{s.on}}" style="min-height: 38px; padding: 0 12px; border-radius: 999px; border: 1px solid #111113; background: {{s.bg}}; color: {{s.fg}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{s.label}}</button></template>
</div>
<label style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 150px; border: 2px dashed #A1A1A8; border-radius: 10px; background: #FAFAFA; font-size: 14px; color: #3F3F46; cursor: pointer; text-align: center; padding: 16px">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
<span style="font-weight: 600">Drop Postman files here or browse</span>
<span style="font-size: 12px; color: #55555D">Collection v2.0 / v2.1 (.json), environments, globals, data files (.csv, .json) or a ZIP export</span>
<input type="file" multiple style="font: inherit; font-size: 12px">
</label>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #3F3F46">Import into<select style="min-height: 40px; padding: 0 10px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 400; background: #FFFFFF"><option>New collection</option><option>Replace "Customer Portal APIs" (keep history)</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #3F3F46">Link requests to test cases<select style="min-height: 40px; padding: 0 10px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 400; background: #FFFFFF"><option>By TC key in request name or description</option><option>Create a test case per request</option><option>Do not link</option></select></label>
</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px"><h2 style="margin: 0; font-size: 16px; font-weight: 600">Compatibility report</h2><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #55555D">orders-api.postman_collection.json · v2.1</span></div>
<template data-sc="for" list="{{report}}" as="r" hint-placeholder-count="7"><div style="display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #EEEEF0; font-size: 13px"><span style="width: 64px; flex: none; font-size: 11px; font-weight: 700; color: {{r.color}}">{{r.mark}}</span><span>{{r.text}}</span></div></template>
</section>
</div>

<aside style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<section style="background: #0B0B0D; color: #FFFFFF; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">Ready to import</h2>
<dl style="margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 13px">
<dt style="color: #A1A1A8">Collection</dt><dd style="margin: 0">Customer Portal APIs</dd>
<dt style="color: #A1A1A8">Folders</dt><dd style="margin: 0">4</dd>
<dt style="color: #A1A1A8">Requests</dt><dd style="margin: 0">14</dd>
<dt style="color: #A1A1A8">Scripts</dt><dd style="margin: 0">12 test, 3 pre-request</dd>
<dt style="color: #A1A1A8">Environments</dt><dd style="margin: 0">staging, qa</dd>
<dt style="color: #A1A1A8">Data files</dt><dd style="margin: 0">orders.csv</dd>
</dl>
<button type="button" style="min-height: 48px; border-radius: 8px; border: 0; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Import collection</button>
<span style="font-size: 12px; color: #A1A1A8">Secret values move to the UTP vault; nothing is sent to Postman.</span>
</section>
</aside>
</div>
</template>

<template data-sc="if" value="{{isExport}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<div style="flex: 3 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">What to export</h2>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #3F3F46; max-width: 420px">Collection<select style="min-height: 40px; padding: 0 10px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 400; background: #FFFFFF"><option>Customer Portal APIs (14 requests)</option><option>Payments API (9 requests)</option></select></label>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; font-size: 13px">
<label style="display: flex; align-items: center; gap: 8px"><input type="checkbox" checked style="accent-color: {{accent}}; width: 18px; height: 18px">Environments (secret values blank)</label>
<label style="display: flex; align-items: center; gap: 8px"><input type="checkbox" checked style="accent-color: {{accent}}; width: 18px; height: 18px">Data files (orders.csv)</label>
<label style="display: flex; align-items: center; gap: 8px"><input type="checkbox" checked style="accent-color: {{accent}}; width: 18px; height: 18px">Saved examples</label>
<label style="display: flex; align-items: center; gap: 8px"><input type="checkbox" checked style="accent-color: {{accent}}; width: 18px; height: 18px">Keep Postman IDs (update on re-import)</label>
</div>
</section>
<section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">Format and destination</h2>
<div role="radiogroup" aria-label="Export format" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px">
<template data-sc="for" list="{{formats}}" as="f" hint-placeholder-count="4"><button type="button" role="radio" aria-checked="{{f.on}}" onClick="{{f.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px; border-radius: 10px; border: {{f.border}}; background: #FFFFFF; font: inherit; text-align: left; cursor: pointer"><span style="font-size: 14px; font-weight: 700">{{f.name}}</span><span style="font-size: 12px; color: #55555D">{{f.desc}}</span></button></template>
</div>
<a href="framework-export.html" style="font-size: 13px; font-weight: 600">Export as Python pytest or behave tests instead</a>
</section>
</div>
<aside style="flex: 2 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<section style="background: #0B0B0D; color: #ECECEE; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 14px; font-weight: 600; color: #FFFFFF">Preview · Collection v2.1</h2>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; line-height: 19px; white-space: pre; overflow-x: auto; padding: 10px; border-radius: 8px; background: #1A1A1D">{{preview}}</div>
</section>
<button type="button" style="min-height: 48px; border-radius: 8px; border: 0; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">{{exportCta}}</button>
</aside>
</div>
</template>

<section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">History</h2>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 620px; border-collapse: collapse; font-size: 13px">
<thead><tr style="text-align: left; color: #55555D; border-bottom: 1px solid #E4E4E7"><th style="padding: 8px; font-weight: 600">Action</th><th style="padding: 8px; font-weight: 600">Source / destination</th><th style="padding: 8px; font-weight: 600">Items</th><th style="padding: 8px; font-weight: 600">Result</th></tr></thead>
<tbody>
<tr style="border-bottom: 1px solid #EEEEF0"><td style="padding: 8px; font-weight: 600">Import</td><td style="padding: 8px">Postman Collection v2.1 file</td><td style="padding: 8px">14 requests, 2 environments</td><td style="padding: 8px"><span style="padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #FFF1DB; color: #8A5300">Imported with 2 notes</span></td></tr>
<tr style="border-bottom: 1px solid #EEEEF0"><td style="padding: 8px; font-weight: 600">Export</td><td style="padding: 8px">ZIP download</td><td style="padding: 8px">Collection, 2 environments, 1 data file</td><td style="padding: 8px"><span style="padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #E7F4EC; color: #165C38">Delivered</span></td></tr>
<tr><td style="padding: 8px; font-weight: 600">Import</td><td style="padding: 8px">OpenAPI 3.1 (payments.yaml)</td><td style="padding: 8px">9 requests generated</td><td style="padding: 8px"><span style="padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #E7F4EC; color: #165C38">Imported</span></td></tr>
</tbody>
</table>
</div>
</section>
</div>
</main>
</div>
</template>
<script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8102E';
    const st = this.state || {};
    const mode = st.mode || 'import';
    const fmt = st.fmt || 'json';
    const imp = mode === 'import';
    const F = [
      ['json', 'Postman Collection v2.1', 'Single .json file, opens in Postman and Newman'],
      ['zip', 'ZIP bundle', 'Collection, environments and data files'],
      ['push', 'Push to Postman workspace', 'Through the Postman API integration'],
      ['newman', 'Newman-ready folder', 'Collection + environment + run script for CI']
    ];
    const CTA = { json: 'Download collection JSON', zip: 'Download ZIP bundle', push: 'Push to Postman', newman: 'Download Newman folder' };
    const ok = (text) => ({ mark: 'OK', color: '#165C38', text });
    const note = (text) => ({ mark: 'NOTE', color: '#8A5300', text });
    return {
      accent, isImport: imp, isExport: !imp,
      impOn: imp ? 'true' : 'false', expOn: imp ? 'false' : 'true',
      impBg: imp ? '#0B0B0D' : 'transparent', impFg: imp ? '#FFFFFF' : '#111113',
      expBg: imp ? 'transparent' : '#0B0B0D', expFg: imp ? '#111113' : '#FFFFFF',
      pickImp: () => this.setState({ mode: 'import' }),
      pickExp: () => this.setState({ mode: 'export' }),
      sources: ['Postman file', 'Link', 'Paste raw', 'Postman API', 'OpenAPI', 'cURL', 'HAR'].map((label, i) => ({ label, on: i === 0 ? 'true' : 'false', bg: i === 0 ? '#0B0B0D' : '#FFFFFF', fg: i === 0 ? '#FFFFFF' : '#111113' })),
      report: [
        ok('Collection format v2.1 · 4 folders, 14 requests, saved examples kept'),
