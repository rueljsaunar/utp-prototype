<span style="font-size: 12px; color: #55555D">Model claude-sonnet · prompt v12 · 14.2k tokens</span>

<script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8102E';
    const mode = (this.state && this.state.mode) || 'case';
    const modeList = [['case', 'From test case'], ['rec', 'From recording'], ['url', 'From URL'], ['req', 'From requirement'], ['mob', 'Mobile (Appium)']];
    const tok = (line) => {
      const out = [];
      const re = /('[^']*')|\b(import|from|const|new|await|async)\b/g;
      let last = 0, m;
      while ((m = re.exec(line))) {
        if (m.index > last) out.push({ t: line.slice(last, m.index), c: '#ECECEE' });
        out.push({ t: m[0], c: m[1] ? '#F7B4C0' : '#FF6B83' });
        last = re.lastIndex;
      }
      if (last < line.length) out.push({ t: line.slice(last), c: '#ECECEE' });
      if (!out.length) out.push({ t: ' ', c: '#ECECEE' });
      return out;
    };
    const src = [
      "test('User can reset password by email link',",
      "  { tag: ['@auth'], annotation: { type: 'utp', description: 'TC-1050' } },",
      "  async ({ page, mailbox }) => {",
      "    const login = new LoginPage(page);",
      "    await test.step('Open Forgot password', async () => {",
      "      await login.goto();",
      "      await page.getByRole('link', { name: 'Forgot password?' }).click();",
      "    });",
      "    await test.step('Submit the account email', async () => {",
      "      await page.getByLabel('Email').fill(process.env.USER_RESET_EMAIL!);",
      "      await page.getByRole('button', { name: 'Send reset link' }).click();",
      "      await expect(page.getByText('Check your inbox')).toBeVisible();",
      "    });",
      "    await test.step('Open the reset link', async () => {",
      "      await page.goto(await mailbox.latestLink('Reset your password'));",
      "      await expect(page.getByLabel('New password')).toBeVisible();",
      "    });",
      "  });"
    ];
    const ok = (text) => ({ mark: 'PASS', color: '#165C38', text });
    return {
      accent,
      modes: modeList.map(([id, label]) => ({ label, sel: id === mode ? 'true' : 'false', bg: id === mode ? '#0B0B0D' : 'transparent', fg: id === mode ? '#FFFFFF' : '#111113', pick: () => this.setState({ mode: id }) })),
      queue: [
        { key: 'TC-1050', title: 'Reset password by email link', status: 'Ready for review', sc: '#A00C25', border: '2px solid ' + accent },
        { key: 'TC-2088', title: 'Login on mobile app (Appium)', status: 'Ready for review', sc: '#A00C25', border: '1px solid #E4E4E7' },
        { key: 'TC-1060', title: 'Account locks after 5 attempts', status: 'Dry run in progress', sc: '#3F3F46', border: '1px solid #E4E4E7' },
        { key: 'TC-0870', title: 'Guest checkout with card', status: 'Needs manual work', sc: '#8A5300', border: '1px solid #E4E4E7' },
        { key: 'REQ-115', title: 'Suggest cases for SSO', status: '6 draft cases created', sc: '#165C38', border: '1px solid #E4E4E7' }
      ],
      steps: [
        { n: 1, action: 'Open login page and click Forgot password', expected: 'Reset form is shown', lines: '5 to 8' },
        { n: 2, action: 'Enter the account email and submit', expected: 'Confirmation message shown', lines: '9 to 13' },
        { n: 3, action: 'Open the reset link from the email', expected: 'New password form is shown', lines: '14 to 17' }
      ],
      code: src.map((s, i) => ({ n: i + 1, seg: tok(s), hl: (i + 1 === 10) ? '#3A0A14' : 'transparent' })),
      checks: [
        ok('TypeScript compile, no errors'),
        ok('ESLint with Playwright plugin, 0 warnings'),
        ok('Only allowed imports used'),
