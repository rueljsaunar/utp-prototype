<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UTP Dashboard</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B0102A}a:hover{color:#7A0A1C}
</style>
<style>:focus-visible{outline:3px solid #C8102E;outline-offset:2px}</style>

</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; color: #111113; background: #F5F5F6">

<nav aria-label="Main" style="flex: 1 1 240px; max-width: 100%; box-sizing: border-box; background: #0B0B0D; color: #FFFFFF; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<div style="width: 32px; height: 32px; border-radius: 8px; background: {{accent}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">U</div>
<div style="display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 16px; letter-spacing: 0.02em">UTP</span><span style="font-size: 11px; color: #A1A1A8">Unified Test Platform</span></div>
</div>
<button type="button" style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid #2A2A2F; background: #141417; color: #FFFFFF; font: inherit; font-size: 13px; cursor: pointer">Project: Customer Portal<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8E8E96; padding: 0 12px 6px">TEST MANAGEMENT</span>
<a href="index.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #FFFFFF; background: #222226; text-decoration: none; font-size: 14px; font-weight: 600"><span style="display: flex; color: {{accent}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg></span>Dashboard</a>
<a href="requirements.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg></span>Requirements</a>
<a href="test-case.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M8 12l3 3 5-6"></path></svg></span>Test Cases</a>
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8E8E96; padding: 14px 12px 6px">AUTOMATION</span>
<a href="scripts.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"></path></svg></span>Scripts</a>
<a href="ai-studio.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg></span>AI Studio</a>
<a href="recorder.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></span>Recorder</a>
<a href="object-repository.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 22V12M21 7l-9 5-9-5"/></svg></span>Object Repository</a>
<a href="framework-export.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg></span>Framework Export</a>
<a href="api-testing.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1M16 3h1a2 2 0 0 1 2 2v5a2 2 0 0 0 2 2 2 2 0 0 0-2 2v5a2 2 0 0 1-2 2h-1"/></svg></span>API Testing</a>
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8E8E96; padding: 14px 12px 6px">EXECUTION</span>
<a href="new-run.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 4l14 8-14 8z"></path></svg></span>New Run</a>
<a href="results.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span>Results</a>
<a href="devices.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"></rect><path d="M11 18h2"></path></svg></span>Devices</a>
<a href="report-builder.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg></span>Reports</a>
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8E8E96; padding: 14px 12px 6px">ADMIN</span>
<a href="integrations.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg></span>Integrations</a>
</div>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px; border-top: 1px solid #222226">
<div style="width: 32px; height: 32px; border-radius: 50%; background: #FFFFFF; color: #0B0B0D; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">QL</div>
<div style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600">QA Lead</span><span style="font-size: 11px; color: #A1A1A8">Admin access</span></div>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 14px 32px; background: #FFFFFF; border-bottom: 1px solid #E4E4E7">
<label style="flex: 1 1 280px; display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border: 1px solid #D4D4D8; border-radius: 8px; color: #5B5B63"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</span><input type="search" placeholder="Search requirements, cases, scripts, runs" style="flex: 1; border: 0; outline: none; font: inherit; font-size: 14px; background: transparent; color: #111113"></label>
<button type="button" aria-label="Notifications" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #D4D4D8; background: #FFFFFF; color: #111113; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"></path></svg></button>
<a href="new-run.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 8px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 4l14 8-14 8z"></path></svg>New run</a>
</header>

<div style="padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 24px; max-width: 1280px; box-sizing: border-box; width: 100%">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div><h1 style="margin: 0; font-size: 28px; font-weight: 700">Dashboard</h1><p style="margin: 4px 0 0; font-size: 14px; color: #55555D">Customer Portal · quality at a glance</p></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center"><label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #55555D">Period<select style="min-height: 40px; padding: 0 10px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 14px; background: #FFFFFF; color: #111113"><option>Last 7 days</option><option>Last 30 days</option><option>Last 90 days</option></select></label><a href="report-builder.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid #111113; background: #FFFFFF; color: #111113; text-decoration: none; font-size: 13px; font-weight: 600">Customize dashboard</a></div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
<div style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #55555D">Pass rate</span><span style="font-size: 32px; font-weight: 700">94.2%</span><span style="font-size: 12px; color: #165C38">+1.8 pts vs prior period</span></div>
<div style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #55555D">Requirement coverage</span><span style="font-size: 32px; font-weight: 700">78%</span><span style="font-size: 12px; color: #55555D">312 of 400 requirements covered</span></div>
<div style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #55555D">Automated test cases</span><span style="font-size: 32px; font-weight: 700">612 <span style="font-size: 16px; font-weight: 500; color: #55555D">/ 940</span></span><span style="font-size: 12px; color: #55555D">38 AI drafts awaiting review</span></div>
<div style="background: #0B0B0D; color: #FFFFFF; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #C4C4CA">Flaky tests</span><span style="font-size: 32px; font-weight: 700">14</span><span style="font-size: 12px; color: #FF8FA0">3 new this period</span></div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px">
<section style="flex: 2 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px"><h2 style="margin: 0; font-size: 16px; font-weight: 600">Executed tests per day</h2>
<div style="display: flex; gap: 16px; font-size: 12px; color: #55555D"><span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; background: #111113; border-radius: 2px"></span>Passed</span><span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; background: {{accent}}; border-radius: 2px"></span>Failed</span></div></div>
<svg viewBox="0 0 640 210" role="img" aria-label="Executed tests per day, passed and failed, last 7 days" style="width: 100%; height: auto">
<line x1="40" y1="180" x2="630" y2="180" stroke="#D4D4D8"></line><line x1="40" y1="120" x2="630" y2="120" stroke="#EEEEF0"></line><line x1="40" y1="60" x2="630" y2="60" stroke="#EEEEF0"></line>
<text x="32" y="184" text-anchor="end" font-size="11" fill="#55555D">0</text><text x="32" y="124" text-anchor="end" font-size="11" fill="#55555D">500</text><text x="32" y="64" text-anchor="end" font-size="11" fill="#55555D">1,000</text>
<rect x="57" y="46" width="48" height="134" fill="#111113"></rect><rect x="57" y="36" width="48" height="8" fill="{{accent}}"></rect>
<rect x="139" y="42" width="48" height="138" fill="#111113"></rect><rect x="139" y="34" width="48" height="6" fill="{{accent}}"></rect>
<rect x="221" y="51" width="48" height="129" fill="#111113"></rect><rect x="221" y="35" width="48" height="14" fill="{{accent}}"></rect>
<rect x="303" y="40" width="48" height="140" fill="#111113"></rect><rect x="303" y="33" width="48" height="5" fill="{{accent}}"></rect>
<rect x="385" y="44" width="48" height="136" fill="#111113"></rect><rect x="385" y="35" width="48" height="7" fill="{{accent}}"></rect>
<rect x="467" y="62" width="48" height="118" fill="#111113"></rect><rect x="467" y="40" width="48" height="20" fill="{{accent}}"></rect>
<rect x="549" y="38" width="48" height="142" fill="#111113"></rect><rect x="549" y="32" width="48" height="4" fill="{{accent}}"></rect>
<text x="81" y="200" text-anchor="middle" font-size="11" fill="#55555D">Fri</text><text x="163" y="200" text-anchor="middle" font-size="11" fill="#55555D">Sat</text><text x="245" y="200" text-anchor="middle" font-size="11" fill="#55555D">Sun</text><text x="327" y="200" text-anchor="middle" font-size="11" fill="#55555D">Mon</text><text x="409" y="200" text-anchor="middle" font-size="11" fill="#55555D">Tue</text><text x="491" y="200" text-anchor="middle" font-size="11" fill="#55555D">Wed</text><text x="573" y="200" text-anchor="middle" font-size="11" fill="#55555D">Thu</text>
</svg>
</section>

<section style="flex: 1 1 300px; min-width: 0; background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-size: 16px; font-weight: 600">Most flaky tests</h2><a href="results.html" style="font-size: 13px; font-weight: 600">View all</a></div>
<template data-sc="for" list="{{flaky}}" as="t" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 6px; padding-bottom: 12px; border-bottom: 1px solid #EEEEF0">
<div style="display: flex; justify-content: space-between; gap: 8px; font-size: 13px"><span style="font-weight: 600">{{t.name}}</span><span style="font-family: 'IBM Plex Mono', monospace; color: #55555D">{{t.key}}</span></div>
<div style="display: flex; align-items: center; gap: 3px"><template data-sc="for" list="{{t.hist}}" as="h" hint-placeholder-count="10"><span style="width: 14px; height: 14px; border-radius: 3px; background: {{h.c}}"></span></template><span style="margin-left: 8px; font-size: 12px; color: #55555D">{{t.rate}} passed</span></div>
</div>
</template>
</section>
</div>

<section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-size: 16px; font-weight: 600">Recent runs</h2><a href="results.html" style="font-size: 13px; font-weight: 600">All runs</a></div>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 820px; border-collapse: collapse; font-size: 13px">
<thead><tr style="text-align: left; color: #55555D; border-bottom: 1px solid #E4E4E7"><th style="padding: 10px 8px; font-weight: 600">Run</th><th style="padding: 10px 8px; font-weight: 600">Platform</th><th style="padding: 10px 8px; font-weight: 600">Target</th><th style="padding: 10px 8px; font-weight: 600">Status</th><th style="padding: 10px 8px; font-weight: 600">Pass rate</th><th style="padding: 10px 8px; font-weight: 600">Duration</th><th style="padding: 10px 8px; font-weight: 600">Triggered by</th></tr></thead>
<tbody>
<template data-sc="for" list="{{runs}}" as="r" hint-placeholder-count="5">
<tr style="border-bottom: 1px solid #EEEEF0"><td style="padding: 12px 8px"><a href="results.html" style="font-weight: 600; text-decoration: none">{{r.name}}</a><div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #55555D">{{r.id}}</div></td><td style="padding: 12px 8px">{{r.platform}}</td><td style="padding: 12px 8px">{{r.target}}</td><td style="padding: 12px 8px"><span style="display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{r.bg}}; color: {{r.fg}}">{{r.status}}</span></td><td style="padding: 12px 8px">{{r.rate}}</td><td style="padding: 12px 8px">{{r.dur}}</td><td style="padding: 12px 8px; color: #55555D">{{r.by}}</td></tr>
</template>
</tbody>
</table>
</div>
</section>
</div>
</main>
</div>
</template>
<script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8102E';
    const S = {
      Passed: { bg: '#E7F4EC', fg: '#165C38' },
      Failed: { bg: '#FBE5E9', fg: '#A00C25' },
      Flaky: { bg: '#FFF1DB', fg: '#8A5300' },
      Running: { bg: '#111113', fg: '#FFFFFF' }
    };
    const run = (id, name, platform, target, status, rate, dur, by) => ({ id, name, platform, target, status, rate, dur, by, bg: S[status].bg, fg: S[status].fg });
    const hist = (s) => s.split('').map((ch) => ({ c: ch === '1' ? '#111113' : accent }));
    return {
      accent,
      runs: [
        run('RUN-1287', 'Nightly regression', 'Web', 'Self-hosted · Chromium, Firefox, WebKit', 'Passed', '97.8%', '18m 42s', 'Schedule'),
        run('RUN-1286', 'Smoke on PR 412', 'Web', 'BrowserStack · Chrome, Safari', 'Failed', '88.0%', '4m 10s', 'GitHub Actions'),
        run('RUN-1285', 'Mobile checkout', 'Android', 'Local lab · 3 devices', 'Flaky', '93.3%', '22m 05s', 'QA Tester'),
        run('RUN-1284', 'iOS login suite', 'iOS', 'BrowserStack · iPhone 15, 14', 'Passed', '100%', '9m 31s', 'QA Lead'),
        run('RUN-1283', 'AI dry run for TC-1042', 'Web', 'Sandbox · Chromium', 'Running', '—', '1m 12s', 'AI Studio')
      ],
      flaky: [
        { name: 'Checkout applies promo code', key: 'TC-0881', rate: '7/10', hist: hist('1101101011') },
        { name: 'Search shows suggestions', key: 'TC-0412', rate: '8/10', hist: hist('1110111101') },
        { name: 'Android push opens order', key: 'TC-2104', rate: '6/10', hist: hist('1010110110') },
        { name: 'Profile photo upload', key: 'TC-0657', rate: '8/10', hist: hist('1111011011') }
      ]
    };
  }
}
</script>
<script type="application/json" id="props">{"accent": "#C8102E"}</script>
</body>
</html>
