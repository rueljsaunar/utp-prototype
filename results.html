    const C = {

      f: { label: 'Failed', bg: '#FBE5E9', fg: '#A00C25' },
      k: { label: 'Flaky', bg: '#FFF1DB', fg: '#8A5300' }
    };
    const row = (name, key, s, sel) => ({ name, key, cells: s.split('').map((ch) => C[ch]), rowBg: sel ? '#FDF3F5' : 'transparent' });
    const step = (status, title, dur) => ({
      status, title, dur,
      bg: status === 'FAILED' ? '#FBE5E9' : '#F5F5F6',
      fg: status === 'FAILED' ? '#A00C25' : (status === 'SKIPPED' ? '#55555D' : '#165C38')
    });
    const hist = '11111111111111111000'.split('').map((ch) => ({ c: ch === '1' ? '#111113' : accent }));
    return {
      accent,
      rows: [
        row('User can log in with valid credentials', 'TC-1042', 'pfp', true),
        row('Locked account shows warning', 'TC-1060', 'ppp', false),
        row('Reset password by email link', 'TC-1050', 'pfp', false),
        row('Guest checkout with card', 'TC-0870', 'ppp', false),
        row('Checkout applies promo code', 'TC-0881', 'kpp', false),
        row('Search shows suggestions', 'TC-0412', 'ppp', false),
        row('Order history lists recent orders', 'TC-0930', 'ppp', false),
        row('Profile photo upload', 'TC-0657', 'ppp', false)
      ],
      steps: [
        step('PASSED', 'Open the login page', '1.1 s'),
        step('PASSED', 'Enter username and password', '402 ms'),
        step('FAILED', 'Click Sign in · expect user name visible', '5.0 s'),
        step('SKIPPED', 'Reload the page', '—'),
        step('SKIPPED', 'Click Sign out', '—')
      ],
      hist
    };
  }
}
</script>
