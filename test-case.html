      Passed: { bg: '#E7F4EC', fg: '#165C38' },
      Failed: { bg: '#FBE5E9', fg: '#A00C25' },
      Flaky: { bg: '#FFF1DB', fg: '#8A5300' }
    };
    const h = (run, where, status) => ({ run, where, status, bg: S[status].bg, fg: S[status].fg });
    return {
      accent,
      dataHint: '{{users.standard}}',
      steps: [
        { n: 1, kw: 'Open', target: 'LoginPage', loc: 'url /login', data: '', expected: 'Login form is displayed', tb: '#E4E4E7' },
        { n: 2, kw: 'Fill', target: 'LoginPage.emailInput', loc: "getByLabel('Email')", data: '{{users.standard.email}}', expected: 'Field accepts input', tb: '#E4E4E7' },
        { n: 3, kw: 'Fill', target: 'LoginPage.passwordInput', loc: "getByLabel('Password')", data: '{{users.standard.password}}', expected: 'Password is masked', tb: '#E4E4E7' },
        { n: 4, kw: 'Click', target: 'LoginPage.signInButton', loc: "getByRole('button', { name: 'Sign in' })", data: '', expected: 'Dashboard opens', tb: accent },
        { n: 5, kw: 'Assert visible', target: 'DashboardPage.userName', loc: "getByTestId('user-name')", data: '', expected: 'User name is shown', tb: '#E4E4E7' }
      ],
      history: [
        h('RUN-1287', 'Chromium', 'Passed'),
        h('RUN-1287', 'WebKit', 'Passed'),
        h('RUN-1286', 'BrowserStack Safari', 'Failed'),
        h('RUN-1281', 'Firefox', 'Flaky')
      ]
    };
  }
}
