<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UTP Object Repository</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B0102A}a:hover{color:#7A0A1C}
</style>
<style>:focus-visible{outline:3px solid #C8102E;outline-offset:2px}</style>
<script src="runtime.js" defer></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; color: #111113; background: #F5F5F6">

<nav aria-label="Main" style="flex: 1 1 240px; max-width: 100%; box-sizing: border-box; background: #0B0B0D; color: #FFFFFF; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<div style="width: 32px; height: 32px; border-radius: 8px; background: {{accent}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">U</div>
<div style="display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 16px; letter-spacing: 0.02em">UTP</span><span style="font-size: 11px; color: #A1A1A8">Unified Test Platform</span></div>
</div>
<button type="button" style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid #2A2A2F; background: #141417; color: #FFFFFF; font: inherit; font-size: 13px; cursor: pointer">Project: Customer Portal<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8E8E96; padding: 0 12px 6px">TEST MANAGEMENT</span>
<a href="index.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></span>Dashboard</a>
<a href="requirements.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></span>Requirements</a>
<a href="test-case.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12l3 3 5-6"/></svg></span>Test Cases</a>
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8E8E96; padding: 14px 12px 6px">AUTOMATION</span>
<a href="scripts.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg></span>Scripts</a>
<a href="ai-studio.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg></span>AI Studio</a>
<a href="recorder.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></span>Recorder</a>
<a href="object-repository.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #FFFFFF; background: #222226; text-decoration: none; font-size: 14px; font-weight: 600"><span style="display: flex; color: {{accent}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 22V12M21 7l-9 5-9-5"/></svg></span>Object Repository</a>
<a href="framework-export.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg></span>Framework Export</a>
<a href="api-testing.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1M16 3h1a2 2 0 0 1 2 2v5a2 2 0 0 0 2 2 2 2 0 0 0-2 2v5a2 2 0 0 1-2 2h-1"/></svg></span>API Testing</a>
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8E8E96; padding: 14px 12px 6px">EXECUTION</span>
<a href="new-run.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg></span>New Run</a>
<a href="results.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>Results</a>
<a href="devices.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></span>Devices</a>
<a href="report-builder.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg></span>Reports</a>
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8E8E96; padding: 14px 12px 6px">ADMIN</span>
<a href="integrations.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></span>Integrations</a>
</div>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px; border-top: 1px solid #222226">
<div style="width: 32px; height: 32px; border-radius: 50%; background: #FFFFFF; color: #0B0B0D; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">QL</div>
<div style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600">QA Lead</span><span style="font-size: 11px; color: #A1A1A8">Admin access</span></div>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<div style="padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 16px; max-width: 1280px; box-sizing: border-box; width: 100%">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div><h1 style="margin: 0; font-size: 28px; font-weight: 700">Object Repository</h1><p style="margin: 4px 0 0; font-size: 14px; color: #55555D">Pages and elements captured from the AUT, with ranked and verified locators</p></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #55555D">Application<select style="min-height: 44px; padding: 0 10px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 14px; background: #FFFFFF"><option>Customer Portal · web</option><option>Customer Portal · Android</option><option>Customer Portal · iOS</option></select></label>
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #111113; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Import / export</button>
<a href="recorder.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #111113; color: #111113; text-decoration: none; font-size: 14px; font-weight: 600">Record flow</a>
<button type="button" style="min-height: 44px; padding: 0 18px; border-radius: 8px; border: 0; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Scan page</button>
</div>
</div>

<div role="status" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 10px; background: #FFF1DB; color: #6B4100; font-size: 13px"><span><strong>Change detected:</strong> 2 elements on CheckoutPage no longer match their primary locator after last night's scan. Suggested replacements are ready.</span><button type="button" style="min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #6B4100; background: transparent; color: #6B4100; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Review 2 changes</button></div>

<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<aside aria-label="Pages" style="flex: 1 1 200px; background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 600; color: #55555D; padding: 0 6px 8px">PAGES</span>
<template data-sc="for" list="{{pages}}" as="p" hint-placeholder-count="6">
<button type="button" style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; padding: 0 10px; border: 0; border-radius: 6px; background: {{p.bg}}; color: {{p.fg}}; font: inherit; font-size: 13px; text-align: left; cursor: pointer"><span>{{p.name}}</span><span style="font-size: 12px; color: {{p.cc}}">{{p.count}}</span></button>
</template>
</aside>

<section aria-label="Elements" style="flex: 3 1 480px; min-width: 0; background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 8px 14px 14px">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0"><h2 style="margin: 0; font-size: 15px; font-weight: 600">LoginPage · 8 elements</h2><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #55555D">/login · scanned today</span></div>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 560px; border-collapse: collapse; font-size: 13px">
<thead><tr style="text-align: left; color: #55555D; border-bottom: 1px solid #E4E4E7"><th style="padding: 10px 8px; font-weight: 600">Element</th><th style="padding: 10px 8px; font-weight: 600">Primary locator</th><th style="padding: 10px 8px; font-weight: 600">Status</th><th style="padding: 10px 8px; font-weight: 600">Used by</th></tr></thead>
<tbody>
<template data-sc="for" list="{{elements}}" as="e" hint-placeholder-count="8">
<tr style="border-bottom: 1px solid #EEEEF0; background: {{e.rowBg}}"><td style="padding: 6px 8px"><button type="button" onClick="{{e.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; min-height: 40px; justify-content: center; padding: 0; border: 0; background: transparent; font: inherit; text-align: left; cursor: pointer"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 600">{{e.name}}</span><span style="font-size: 11px; color: #55555D">{{e.type}}</span></button></td><td style="padding: 6px 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px">{{e.primary}}</td><td style="padding: 6px 8px"><span style="padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: {{e.bg}}; color: {{e.fg}}">{{e.status}}</span></td><td style="padding: 6px 8px; color: #55555D">{{e.used}}</td></tr>
</template>
</tbody>
</table>
</div>
</section>

<aside aria-label="Element detail" style="flex: 2 1 340px; min-width: 0; background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="height: 120px; border-radius: 8px; background: #F5F5F6; display: flex; align-items: center; justify-content: center; position: relative">
<div style="width: 180px; min-height: 36px; border-radius: 6px; background: #111113; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; outline: 3px solid {{accent}}; outline-offset: 3px">{{sel.preview}}</div>
<span style="position: absolute; left: 8px; bottom: 6px; font-size: 11px; color: #55555D">Snapshot crop · redacted</span>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #3F3F46">Logical name<input value="{{sel.name}}" style="min-height: 40px; padding: 0 10px; border: 1px solid #D4D4D8; border-radius: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 400"></label>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 600; color: #3F3F46">Ranked locators</span>
<template data-sc="for" list="{{sel.locators}}" as="l" hint-placeholder-count="4">
<div style="display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; border: {{l.border}}; font-size: 12px">
<span style="width: 20px; font-weight: 700">{{l.rank}}</span>
<div style="flex: 1; min-width: 0"><div style="font-weight: 600">{{l.strategy}}</div><div style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; word-break: break-all">{{l.value}}</div></div>
<span style="font-size: 11px; font-weight: 700; color: {{l.uc}}">{{l.unique}}</span>
</div>
</template>
</div>
<div style="background: #0B0B0D; color: #ECECEE; border-radius: 8px; padding: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; line-height: 19px; white-space: pre-wrap">{{sel.pyCode}}</div>
<div style="font-size: 12px; color: #55555D">Used by {{sel.usedLong}}</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid #111113; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Pin primary</button><button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 8px; border: 0; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Verify now</button></div>
</aside>
</div>
</div>
</main>
</div>
</template>
<script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8102E';
    const picked = (this.state && this.state.el) || 'signInButton';
    const S = {
      Verified: { bg: '#E7F4EC', fg: '#165C38' },
      Changed: { bg: '#FFF1DB', fg: '#8A5300' },
      New: { bg: '#111113', fg: '#FFFFFF' }
    };
    const snake = (s) => s.replace(/[A-Z]/g, (c) => '_' + c.toLowerCase());
    const E = [
      ['emailInput', 'Text input', "getByLabel('Email')", 'Verified', '6 steps', 'Email', [['Label', "getByLabel('Email')"], ['Test id', "getByTestId('email')"], ['CSS', 'input[name=email]']]],
      ['passwordInput', 'Password input', "getByLabel('Password')", 'Verified', '6 steps', 'Password', [['Label', "getByLabel('Password')"], ['Test id', "getByTestId('password')"], ['CSS', 'input[type=password]']]],
      ['signInButton', 'Button', "getByRole('button', { name: 'Sign in' })", 'Verified', '9 steps · 3 scripts', 'Sign in', [['Role + name', "getByRole('button', { name: 'Sign in' })"], ['Test id', "getByTestId('sign-in')"], ['CSS', 'form#login button[type=submit]'], ['XPath', "//form[@id='login']//button"]]],
      ['forgotPasswordLink', 'Link', "getByRole('link', { name: 'Forgot password?' })", 'Verified', '2 steps', 'Forgot password?', [['Role + name', "getByRole('link', { name: 'Forgot password?' })"], ['Text', "getByText('Forgot password?')"]]],
      ['rememberMeCheckbox', 'Checkbox', "getByLabel('Remember me')", 'New', 'not used yet', 'Remember me', [['Label', "getByLabel('Remember me')"], ['CSS', 'input#remember']]],
      ['ssoButton', 'Button', "getByRole('button', { name: 'Use company SSO' })", 'Verified', '3 steps', 'Use company SSO', [['Role + name', "getByRole('button', { name: 'Use company SSO' })"], ['Test id', "getByTestId('sso')"]]],
      ['errorBanner', 'Alert', "getByRole('alert')", 'New', 'not used yet', 'Error banner', [['Role', "getByRole('alert')"], ['CSS', '.login-error']]],
      ['brandLogo', 'Image', "getByRole('img', { name: 'Logo' })", 'Verified', '1 step', 'Logo', [['Role + name', "getByRole('img', { name: 'Logo' })"], ['Alt', "getByAltText('Logo')"]]]
    ];
    const cur = E.find((e) => e[0] === picked) || E[2];
    return {
      accent,
      pages: [
        { name: 'LoginPage', count: '8', on: true },
        { name: 'DashboardPage', count: '14' },
        { name: 'CheckoutPage', count: '22 · 2 changed' },
        { name: 'SearchResultsPage', count: '11' },
        { name: 'ProfilePage', count: '9' },
        { name: 'ResetPasswordPage', count: '5' }
      ].map((p) => ({ ...p, bg: p.on ? '#0B0B0D' : 'transparent', fg: p.on ? '#FFFFFF' : '#111113', cc: p.on ? '#C4C4CA' : (p.count.indexOf('changed') > -1 ? '#8A5300' : '#55555D') })),
      elements: E.map(([name, type, primary, status, used]) => ({ name, type, primary, status, used, bg: S[status].bg, fg: S[status].fg, rowBg: name === picked ? '#FDF3F5' : 'transparent', pick: () => this.setState({ el: name }) })),
      sel: {
        name: 'LoginPage.' + cur[0],
        preview: cur[5],
        usedLong: cur[4],
        locators: cur[6].map(([strategy, value], i) => ({ rank: i + 1, strategy, value, unique: i < 3 ? '1 match' : '1 match · last resort', uc: '#165C38', border: i === 0 ? '2px solid ' + accent : '1px solid #E4E4E7' })),
        pyCode: '# pages/login_page.py (generated)\nclass LoginPage(BasePage):\n    @property\n    def ' + snake(cur[0]) + '(self):\n        return self.page.' + snake(cur[6][0][1].split('(')[0]) + '(' + cur[6][0][1].split('(').slice(1).join('(').replace(/\{ name: (.*) \}/, 'name=$1')
      }
    };
  }
}
</script>
<script type="application/json" id="props">{"accent": "#C8102E"}</script>
</body>
</html>
