<div style="display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 16px; letter-spacing: 0.02em">UTP</span><span style="font-size: 11px; color: #A1A1A8">Unified Test Platform</span></div>
</div>
<button type="button" style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid #2A2A2F; background: #141417; color: #FFFFFF; font: inherit; font-size: 13px; cursor: pointer">Project: Customer Portal<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>

<a href="index.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg></span>Dashboard</a>
<a href="requirements.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #FFFFFF; background: #222226; text-decoration: none; font-size: 14px; font-weight: 600"><span style="display: flex; color: {{accent}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg></span>Requirements</a>

<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8E8E96; padding: 14px 12px 6px">AUTOMATION</span>
<a href="scripts.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"></path></svg></span>Scripts</a>
<a href="ai-studio.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg></span>AI Studio</a>
<a href="recorder.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></span>Recorder</a>
<a href="object-repository.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 22V12M21 7l-9 5-9-5"/></svg></span>Object Repository</a>
<a href="framework-export.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg></span>Framework Export</a>
<a href="api-testing.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1M16 3h1a2 2 0 0 1 2 2v5a2 2 0 0 0 2 2 2 2 0 0 0-2 2v5a2 2 0 0 1-2 2h-1"/></svg></span>API Testing</a>
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8E8E96; padding: 14px 12px 6px">EXECUTION</span>
<a href="new-run.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 4l14 8-14 8z"></path></svg></span>New Run</a>
<a href="results.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span>Results</a>
<a href="devices.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"></rect><path d="M11 18h2"></path></svg></span>Devices</a>
<a href="report-builder.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg></span>Reports</a>
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8E8E96; padding: 14px 12px 6px">ADMIN</span>
<a href="integrations.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg></span>Integrations</a>
</div>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px; border-top: 1px solid #222226">
<div style="width: 32px; height: 32px; border-radius: 50%; background: #FFFFFF; color: #0B0B0D; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">QL</div>
<div style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600">QA Lead</span><span style="font-size: 11px; color: #A1A1A8">Admin access</span></div>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<div style="padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 20px; max-width: 1280px; box-sizing: border-box; width: 100%">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div><h1 style="margin: 0; font-size: 28px; font-weight: 700">Requirements</h1><p style="margin: 4px 0 0; font-size: 14px; color: #55555D">400 requirements · 78% covered by at least one passing case</p></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #111113; background: #FFFFFF; color: #111113; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Sync from Jira</button>
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #111113; background: #FFFFFF; color: #111113; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Export matrix</button>
<button type="button" style="min-height: 44px; padding: 0 18px; border-radius: 8px; border: 0; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">New requirement</button>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
<label style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #55555D">Search<input type="search" placeholder="Title, key or Jira issue" style="min-height: 40px; padding: 0 12px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 14px; background: #FFFFFF"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #55555D">Priority<select style="min-height: 40px; padding: 0 10px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 14px; background: #FFFFFF"><option>All</option><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #55555D">Coverage<select style="min-height: 40px; padding: 0 10px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 14px; background: #FFFFFF"><option>Any</option><option>Not covered</option><option>Partly automated</option><option>Fully automated</option></select></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #55555D">Release<select style="min-height: 40px; padding: 0 10px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 14px; background: #FFFFFF"><option>Release 4.2</option><option>Release 4.1</option></select></label>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<aside aria-label="Requirement tree" style="flex: 1 1 240px; background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 4px; font-size: 14px">
<span style="font-size: 12px; font-weight: 600; color: #55555D; padding-bottom: 8px">EPICS</span>
<button type="button" style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 6px; border: 0; background: #0B0B0D; color: #FFFFFF; font: inherit; font-size: 14px; text-align: left; cursor: pointer">Authentication<span style="font-size: 12px; color: #C4C4CA">24</span></button>
<button type="button" style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 6px; border: 0; background: transparent; color: #111113; font: inherit; font-size: 14px; text-align: left; cursor: pointer">Checkout and payment<span style="font-size: 12px; color: #55555D">61</span></button>
<button type="button" style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 6px; border: 0; background: transparent; color: #111113; font: inherit; font-size: 14px; text-align: left; cursor: pointer">Search and catalogue<span style="font-size: 12px; color: #55555D">48</span></button>
<button type="button" style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 6px; border: 0; background: transparent; color: #111113; font: inherit; font-size: 14px; text-align: left; cursor: pointer">Mobile app<span style="font-size: 12px; color: #55555D">87</span></button>
<button type="button" style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 6px; border: 0; background: transparent; color: #111113; font: inherit; font-size: 14px; text-align: left; cursor: pointer">Account and profile<span style="font-size: 12px; color: #55555D">35</span></button>
<button type="button" style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 6px; border: 0; background: transparent; color: #111113; font: inherit; font-size: 14px; text-align: left; cursor: pointer">Notifications<span style="font-size: 12px; color: #55555D">19</span></button>
</aside>

<section style="flex: 3 1 600px; min-width: 0; background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 8px 16px 16px">
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 760px; border-collapse: collapse; font-size: 13px">
<thead><tr style="text-align: left; color: #55555D; border-bottom: 1px solid #E4E4E7"><th style="padding: 12px 8px; font-weight: 600">Requirement</th><th style="padding: 12px 8px; font-weight: 600">Priority</th><th style="padding: 12px 8px; font-weight: 600">Cases</th><th style="padding: 12px 8px; font-weight: 600; width: 160px">Automated</th><th style="padding: 12px 8px; font-weight: 600">Last result</th><th style="padding: 12px 8px; font-weight: 600">Jira</th></tr></thead>
<tbody>
<template data-sc="for" list="{{reqs}}" as="r" hint-placeholder-count="6">
<tr style="border-bottom: 1px solid #EEEEF0"><td style="padding: 12px 8px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #55555D">{{r.key}}</div><a href="test-case.html" style="font-weight: 600; color: #111113; text-decoration: none">{{r.title}}</a></td><td style="padding: 12px 8px">{{r.prio}}</td><td style="padding: 12px 8px">{{r.cases}}</td><td style="padding: 12px 8px"><div style="display: flex; align-items: center; gap: 8px"><div style="flex: 1; height: 6px; background: #EEEEF0; border-radius: 3px; overflow: hidden"><div style="height: 6px; width: {{r.pct}}; background: #111113"></div></div><span style="font-size: 12px; width: 36px">{{r.pct}}</span></div></td><td style="padding: 12px 8px"><span style="display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{r.bg}}; color: {{r.fg}}">{{r.status}}</span></td><td style="padding: 12px 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px">{{r.jira}}</td></tr>
</template>
</tbody>
</table>
</div>
</section>
</div>

<section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<div><h2 style="margin: 0; font-size: 16px; font-weight: 600">Traceability matrix · Authentication</h2><p style="margin: 4px 0 0; font-size: 13px; color: #55555D">Each cell shows the latest automated result of a test case linked to a requirement</p></div>
<div style="display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: #55555D">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #111113"></span>Passed</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: {{accent}}"></span>Failed</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #E0A040"></span>Flaky</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; border: 1px dashed #8E8E96"></span>Linked, not automated</span>
</div>
</div>
<div style="overflow-x: auto">
<div style="display: grid; grid-template-columns: 240px repeat(8, 64px); gap: 6px; min-width: 760px; font-size: 12px">
<span></span>
<template data-sc="for" list="{{cols}}" as="c" hint-placeholder-count="8"><span style="font-family: 'IBM Plex Mono', monospace; color: #55555D; text-align: center">{{c}}</span></template>
<template data-sc="for" list="{{matrix}}" as="row" hint-placeholder-count="5">
<span style="font-weight: 600; display: flex; align-items: center; min-height: 32px">{{row.key}} {{row.title}}</span>
<template data-sc="for" list="{{row.cells}}" as="cell" hint-placeholder-count="8"><span title="{{cell.label}}" style="height: 32px; border-radius: 6px; background: {{cell.bg}}; border: {{cell.border}}"></span></template>
</template>
</div>
</div>
</section>
</div>
</main>
</div>
</template>
<script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8102E';
    const S = {
      Passed: { bg: '#E7F4EC', fg: '#165C38' },
      Failed: { bg: '#FBE5E9', fg: '#A00C25' },
      Flaky: { bg: '#FFF1DB', fg: '#8A5300' },
      'Not run': { bg: '#EEEEF0', fg: '#3F3F46' }
    };
    const req = (key, title, prio, cases, pct, status, jira) => ({ key, title, prio, cases, pct, status, jira, bg: S[status].bg, fg: S[status].fg });
    const C = {
      p: { bg: '#111113', border: '0', label: 'Passed' },
      f: { bg: accent, border: '0', label: 'Failed' },
      k: { bg: '#E0A040', border: '0', label: 'Flaky' },
      m: { bg: 'transparent', border: '1px dashed #8E8E96', label: 'Linked, not automated' },
      x: { bg: '#F5F5F6', border: '0', label: 'Not linked' }
    };
    const cells = (s) => s.split('').map((ch) => C[ch]);
    return {
      accent,
      reqs: [
        req('REQ-112', 'Log in with email and password', 'High', 6, '100%', 'Passed', 'PORTAL-221'),
        req('REQ-113', 'Reset password by email link', 'High', 4, '75%', 'Failed', 'PORTAL-222'),
        req('REQ-114', 'Lock account after 5 failed attempts', 'Critical', 3, '67%', 'Passed', 'PORTAL-223'),
        req('REQ-115', 'Single sign-on with company IdP', 'Medium', 5, '40%', 'Flaky', 'PORTAL-230'),
        req('REQ-116', 'Remember device for 30 days', 'Low', 2, '0%', 'Not run', 'PORTAL-231'),
        req('REQ-117', 'Biometric login on mobile app', 'Medium', 4, '50%', 'Passed', 'PORTAL-245')
      ],
      cols: ['TC-1042', 'TC-1043', 'TC-1044', 'TC-1050', 'TC-1051', 'TC-1060', 'TC-2088', 'TC-2089'],
      matrix: [
        { key: 'REQ-112', title: 'Log in', cells: cells('ppppxxpp') },
        { key: 'REQ-113', title: 'Reset password', cells: cells('xxpfpmxx') },
        { key: 'REQ-114', title: 'Account lock', cells: cells('pxxxxpmx') },
        { key: 'REQ-115', title: 'Single sign-on', cells: cells('xkxxmxmm') },
        { key: 'REQ-117', title: 'Biometric login', cells: cells('xxxxxxpm') }
      ]
    };
  }
}
</script>
<script type="application/json" id="props">{"accent": "#C8102E"}</script>
</body>
</html>
