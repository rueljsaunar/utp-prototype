<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">

<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8E8E96; padding: 14px 12px 6px">AUTOMATION</span>

<a href="ai-studio.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg></span>AI Studio</a>
<a href="recorder.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></span>Recorder</a>
<a href="object-repository.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 22V12M21 7l-9 5-9-5"/></svg></span>Object Repository</a>
<a href="framework-export.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #FFFFFF; background: #222226; text-decoration: none; font-size: 14px; font-weight: 600"><span style="display: flex; color: {{accent}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg></span>Framework Export</a>
<a href="api-testing.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1M16 3h1a2 2 0 0 1 2 2v5a2 2 0 0 0 2 2 2 2 0 0 0-2 2v5a2 2 0 0 1-2 2h-1"/></svg></span>API Testing</a>
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #8E8E96; padding: 14px 12px 6px">EXECUTION</span>

<a href="report-builder.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C4C4CA; text-decoration: none; font-size: 14px"><span style="display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg></span>Reports</a>

<div style="width: 32px; height: 32px; border-radius: 50%; background: #FFFFFF; color: #0B0B0D; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">QL</div>
<div style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600">QA Lead</span><span style="font-size: 11px; color: #A1A1A8">Admin access</span></div>

</nav>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<div style="padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 16px; max-width: 1280px; box-sizing: border-box; width: 100%">
<div><h1 style="margin: 0; font-size: 28px; font-weight: 700">Framework export</h1><p style="margin: 4px 0 0; font-size: 14px; color: #55555D">Export the entire automation project in your framework's structure, to GitHub or as a ZIP</p></div>

<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<div style="flex: 3 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">1 · Target framework</h2>
<div role="radiogroup" aria-label="Target framework" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px">
<template data-sc="for" list="{{targets}}" as="t" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{t.on}}" onClick="{{t.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px; border-radius: 10px; border: {{t.border}}; background: #FFFFFF; font: inherit; text-align: left; cursor: pointer"><span style="font-size: 14px; font-weight: 700">{{t.name}}</span><span style="font-size: 12px; color: #55555D">{{t.desc}}</span></button>
</template>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end">
<label style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #3F3F46">Framework profile<select style="min-height: 40px; padding: 0 10px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 400; background: #FFFFFF"><option>{{profile}}</option><option>UTP default</option><option>New profile…</option></select></label>
<button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid #111113; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Analyze client repo</button>
<button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid #D4D4D8; background: #FFFFFF; font: inherit; font-size: 13px; cursor: pointer">Edit templates</button>
</div>
<p style="margin: 0; font-size: 12px; color: #55555D">Profile settings: snake_case files and functions, BasePage in pages/base_page.py, fixtures in conftest.py, tags mapped to markers, Allure reporting.</p>
</section>

<section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">2 · Scope and contents</h2>
<div style="display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px">
<label style="display: flex; align-items: center; gap: 8px"><input type="radio" name="scope" checked style="accent-color: {{accent}}; width: 18px; height: 18px">Entire project · 148 tests</label>
<label style="display: flex; align-items: center; gap: 8px"><input type="radio" name="scope" style="accent-color: {{accent}}; width: 18px; height: 18px">Selected suites</label>
<label style="display: flex; align-items: center; gap: 8px"><input type="radio" name="scope" style="accent-color: {{accent}}; width: 18px; height: 18px">By tag</label>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; font-size: 13px">
<label style="display: flex; align-items: center; gap: 8px"><input type="checkbox" checked style="accent-color: {{accent}}; width: 18px; height: 18px">Page objects from Object Repository</label>
<label style="display: flex; align-items: center; gap: 8px"><input type="checkbox" checked style="accent-color: {{accent}}; width: 18px; height: 18px">Mobile tests (Appium-Python-Client)</label>
<label style="display: flex; align-items: center; gap: 8px"><input type="checkbox" checked style="accent-color: {{accent}}; width: 18px; height: 18px">API tests (requests) + Postman collection</label>
<label style="display: flex; align-items: center; gap: 8px"><input type="checkbox" checked style="accent-color: {{accent}}; width: 18px; height: 18px">Test-data templates (.example only)</label>
<label style="display: flex; align-items: center; gap: 8px"><input type="checkbox" checked style="accent-color: {{accent}}; width: 18px; height: 18px">CI workflow (GitHub Actions)</label>
<label style="display: flex; align-items: center; gap: 8px"><input type="checkbox" checked style="accent-color: {{accent}}; width: 18px; height: 18px">README and setup guide</label>
<label style="display: flex; align-items: center; gap: 8px"><input type="checkbox" style="accent-color: {{accent}}; width: 18px; height: 18px">Smoke run before delivery</label>
</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">3 · Destination</h2>
<div role="radiogroup" aria-label="Destination" style="display: flex; gap: 8px">
<button type="button" role="radio" aria-checked="{{ghOn}}" onClick="{{pickGh}}" style="min-height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid #111113; background: {{ghBg}}; color: {{ghFg}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">GitHub repository</button>
<button type="button" role="radio" aria-checked="{{zipOn}}" onClick="{{pickZip}}" style="min-height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid #111113; background: {{zipBg}}; color: {{zipFg}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">ZIP download</button>
</div>
<template data-sc="if" value="{{isGh}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #3F3F46">Repository<select style="min-height: 40px; padding: 0 10px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 400; background: #FFFFFF"><option>[org]/customer-portal-tests (existing)</option><option>Create new private repository</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #3F3F46">Branch<input value="utp-export/2026-10-20" style="min-height: 40px; padding: 0 10px; border: 1px solid #D4D4D8; border-radius: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 400"></label>
</div>
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px"><input type="checkbox" checked style="accent-color: {{accent}}; width: 18px; height: 18px">Open a pull request to main (no direct push)</label>
<span style="font-size: 12px; color: #55555D">Connected through the UTP GitHub App with access to selected repositories only.</span>
</template>
<template data-sc="if" value="{{isZip}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #3F3F46">File name<input value="customer-portal-tests.zip" style="min-height: 40px; padding: 0 10px; border: 1px solid #D4D4D8; border-radius: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 400"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #3F3F46">Link expires<select style="min-height: 40px; padding: 0 10px; border: 1px solid #D4D4D8; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 400; background: #FFFFFF"><option>After 24 hours</option><option>After 1 hour</option></select></label>
</div>
<span style="font-size: 12px; color: #55555D">Includes manifest.json and SHA-256 checksums. Secrets are never included.</span>
</template>
</section>
</div>

<aside style="flex: 2 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<section aria-label="Preview" style="background: #0B0B0D; color: #ECECEE; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-size: 14px; font-weight: 600; color: #FFFFFF">Preview</h2><span style="font-size: 12px; color: #A1A1A8">{{fileCount}}</span></div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 20px; white-space: pre; overflow-x: auto; padding: 10px; border-radius: 8px; background: #1A1A1D">{{tree}}</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; line-height: 19px; white-space: pre; overflow-x: auto; padding: 10px; border-radius: 8px; background: #1A1A1D">{{sample}}</div>
</section>
<section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 8px; font-size: 13px">
<h2 style="margin: 0; font-size: 14px; font-weight: 600">Validation (last dry run)</h2>
<template data-sc="for" list="{{checks}}" as="c" hint-placeholder-count="4"><div style="display: flex; gap: 8px"><span style="width: 44px; flex: none; font-weight: 700; color: {{c.color}}">{{c.mark}}</span><span>{{c.text}}</span></div></template>
</section>
<button type="button" style="min-height: 48px; border-radius: 8px; border: 0; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">{{cta}}</button>
</aside>
</div>

<section style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">Export history</h2>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 680px; border-collapse: collapse; font-size: 13px">
<thead><tr style="text-align: left; color: #55555D; border-bottom: 1px solid #E4E4E7"><th style="padding: 10px 8px; font-weight: 600">Export</th><th style="padding: 10px 8px; font-weight: 600">Framework</th><th style="padding: 10px 8px; font-weight: 600">Destination</th><th style="padding: 10px 8px; font-weight: 600">Status</th><th style="padding: 10px 8px; font-weight: 600">Result</th></tr></thead>
<tbody>
<tr style="border-bottom: 1px solid #EEEEF0"><td style="padding: 10px 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px">EXP-031</td><td style="padding: 10px 8px">Python · pytest</td><td style="padding: 10px 8px">GitHub</td><td style="padding: 10px 8px"><span style="padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #E7F4EC; color: #165C38">Delivered</span></td><td style="padding: 10px 8px"><a href="#" style="font-weight: 600">Pull request #57</a> · 3 items need review</td></tr>
<tr style="border-bottom: 1px solid #EEEEF0"><td style="padding: 10px 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px">EXP-030</td><td style="padding: 10px 8px">Python · behave</td><td style="padding: 10px 8px">ZIP</td><td style="padding: 10px 8px"><span style="padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #E7F4EC; color: #165C38">Delivered</span></td><td style="padding: 10px 8px">Link expired</td></tr>
<tr><td style="padding: 10px 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px">EXP-029</td><td style="padding: 10px 8px">Python · pytest</td><td style="padding: 10px 8px">GitHub</td><td style="padding: 10px 8px"><span style="padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #FBE5E9; color: #A00C25">Validation failed</span></td><td style="padding: 10px 8px">2 tests failed collection · <a href="#" style="font-weight: 600">report</a></td></tr>
</tbody>
</table>
</div>
</section>
</div>
</main>
</div>
</template>
<script type="text/plain" id="logic">
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8102E';
    const st = this.state || {};
    const fw = st.fw || 'pytest';
    const dest = st.dest || 'gh';
    const T = [
      ['pytest', 'Python · pytest', 'pytest-playwright, page objects, conftest fixtures'],
      ['behave', 'Python · behave', 'Gherkin features, step definitions, page objects'],
      ['ts', 'Playwright TypeScript', 'Native @playwright/test project']
    ];
    const TREE = {
      pytest: 'customer-portal-tests/\n  pages/      base_page.py  login_page.py  …\n  tests/auth/ test_login.py  test_reset_password.py\n  tests/mobile/ test_login_android.py\n  data/       users.example.yaml\n  conftest.py  pytest.ini  requirements.txt\n  .env.example  README.md\n  .github/workflows/tests.yml',
      behave: 'customer-portal-bdd/\n  features/auth/login.feature\n  features/steps/auth_steps.py\n  features/environment.py\n  pages/      base_page.py  login_page.py  …\n  behave.ini  requirements.txt\n  .env.example  README.md',
